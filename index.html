:root{--panel:#fff;--navy:#132a4b;--gold:#f0bd35;--line:#dce3ec}

.home-tile.upcoming{background:#f7f9fc;border-style:dashed;box-shadow:none;cursor:default}.workspace-label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#65738a;font-weight:850;margin:16px 0 9px}.workspace-context{margin-bottom:16px}.stats-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stats-mini .card{padding:15px}.stats-mini .stat{font-size:26px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 13px}.section-heading h2{margin:0}.foot{margin-top:22px}

</style></head><body><header class="top"><div class="shell"><div class="brand"><span class="mark">♛</span>LEAGUE HQ<small>DIRECTOR + PLAYER HUB</small></div><div class="row"><span id="who" class="mini muted"></span><button id="logout" class="btn ghost hide">Sign out</button></div></div></header><main id="root" class="shell"><div class="card">Connecting…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
// Supabase browser publishable key: never include service-role or secret keys.
const PROJECT_URL='https://sfukoetvqhtyunyatvup.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_tAQnKyT7aRSeYIf68IfObQ_wOA7LHNB';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tab:'overview',orgs:[],membership:[],leagues:[],seasons:[],players:[],orgId:'',leagueId:'',seasonId:'',archived:false,busy:false,loading:false,error:'',message:'',user:null};
let db;
// Recovery links can use hash tokens or an authorization-code redirect.
const authHash = new URLSearchParams(location.hash.replace(/^#/,''));
const authSearch = new URLSearchParams(location.search);
let recoveryMode = authHash.get('type') === 'recovery' || authSearch.get('type') === 'recovery' || authSearch.get('lhq_action') === 'recover';
let recoveryVerified = false;
let recoveryError = authHash.get('error_description') || authSearch.get('error_description') || '';
const recoveryRedirect = () => location.origin + location.pathname + '?lhq_action=recover';
function cleanRecoveryUrl(){history.replaceState(null,'',location.pathname);}

const opts={auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}};
function setAlert(message,error=false){state.message=error?'':message;state.error=error?message:'';renderAlert();}
function renderAlert(){const el=$('alerts');if(el)el.innerHTML=(state.error?`<div class="note error" role="alert">${esc(state.error)}</div>`:state.message?`<div class="note success" role="status">${esc(state.message)}</div>`:'');}
function busy(on){state.busy=on;document.querySelectorAll('button[data-write]').forEach(x=>x.disabled=on)}
async function init(){
 if(!window.supabase?.createClient){$('root').innerHTML='<div class="note error">Could not load the Supabase client library. Check your internet connection or content-blocking settings.</div>';return}
 db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,opts);
 $('logout').addEventListener('click',async()=>{await db.auth.signOut();recoveryMode=false;recoveryVerified=false;cleanRecoveryUrl();state.user=null;reset();render()});
 db.auth.onAuthStateChange((event,session)=>{
   state.user=session?.user||null;updateHeader();
   if(event==='PASSWORD_RECOVERY'){
     recoveryMode=true;recoveryVerified=!!session?.user;
     // Defer DOM updates until the auth callback finishes.
     setTimeout(()=>renderPasswordRecovery(),0);
   }
 });
 const {data,error}=await db.auth.getSession();
 if(error){renderLogin(error.message);return}
 state.user=data.session?.user||null;updateHeader();
 if(recoveryMode){
   // An authenticated session is required before updateUser can change the password.
   recoveryVerified=!!data.session?.user;
   renderPasswordRecovery();return;
 }
 if(state.user)await refresh();else renderLogin();
}
function updateHeader(){$('who').textContent=state.user?.email||'';$('logout').classList.toggle('hide',!state.user)}
function reset(){state.orgs=[];state.membership=[];state.leagues=[];state.seasons=[];state.players=[];state.orgId='';state.leagueId='';state.seasonId='';state.error='';state.message='';state.tab='overview';updateHeader()}
function renderLogin(msg=''){$('root').innerHTML=`<div class="card login"><div class="eyebrow">Sovereign Sports · Development</div><h1>Director sign in</h1><p>Use the application user you created in the new League HQ Supabase project.</p><form id="loginForm"><label class="field"><span class="label">Email address</span><input id="email" type="email" autocomplete="username" required></label><label class="field"><span class="label">Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" id="loginBtn">Sign in</button></form><p style="margin-top:12px"><button class="btn ghost" id="forgotPassword" type="button">Forgot password?</button></p><div id="alerts" style="margin-top:14px"></div><div class="foot">Version 0.4 · Director Hub · Not a public player portal</div></div>`;if(msg)setAlert(msg,true);$('forgotPassword').onclick=renderForgotPassword;$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){b.disabled=false;b.textContent='Sign in';setAlert(error.message,true);return}state.user=data.user;updateHeader();await refresh()}}
function renderForgotPassword(){
 $('root').innerHTML=`<div class="card login"><div class="eyebrow">League HQ · Account recovery</div><h1>Reset your password</h1><p>Enter the email for your League HQ Director Hub login. We’ll email a one-time recovery link.</p><form id="forgotForm"><label class="field"><span class="label">Email address</span><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn primary" id="sendRecovery" type="submit">Send recovery email</button></form><p style="margin-top:12px"><button class="btn ghost" id="backToLogin" type="button">Back to sign in</button></p><div id="alerts" aria-live="polite"></div><div class="foot">If no email arrives, check spam and Supabase Auth email sending limits. Use the newest recovery email link.</div></div>`;
 $('backToLogin').onclick=()=>renderLogin();
 $('forgotForm').onsubmit=async e=>{
   e.preventDefault();const button=$('sendRecovery');button.disabled=true;button.textContent='Sending…';
   try{
     const email=$('recoveryEmail').value.trim();
     const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:recoveryRedirect()});
     if(error)throw error;
     setAlert('If that address has a League HQ account, a recovery email will be sent. Open the newest link to set your new password.');
   }catch(err){setAlert('Could not send recovery email: '+(err.message||String(err)),true)}
   finally{button.disabled=false;button.textContent='Send recovery email'}
 };
}
function renderPasswordRecovery(){
 const canUpdate=recoveryVerified&&!!state.user;
 $('root').innerHTML=`<div class="card login"><div class="eyebrow">League HQ · Account recovery</div><h1>${canUpdate?'Choose a new password':'Verify recovery link'}</h1>${canUpdate?'<p>Your recovery link was accepted. Enter a new password for your League HQ application account.</p>':'<p>We could not establish a valid recovery session. The link may have expired or already been used. Request a fresh recovery email below.</p>'}${canUpdate?`<form id="newPasswordForm"><label class="field"><span class="label">New password (at least 8 characters)</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="field"><span class="label">Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="btn primary" id="saveNewPassword" type="submit">Update password</button></form>`:'<button class="btn primary" id="requestFreshLink" type="button">Request a new recovery link</button>'}<p style="margin-top:12px"><button class="btn ghost" id="returnToLogin" type="button">Back to sign in</button></p><div id="alerts" aria-live="polite"></div></div>`;
 $('returnToLogin').onclick=async()=>{recoveryMode=false;recoveryVerified=false;cleanRecoveryUrl();await db.auth.signOut();state.user=null;updateHeader();renderLogin()};
 if(!canUpdate){if($('requestFreshLink'))$('requestFreshLink').onclick=()=>{recoveryMode=false;cleanRecoveryUrl();renderForgotPassword()};if(recoveryError)setAlert(decodeURIComponent(recoveryError.replace(/\+/g,' ')),true);return}
 $('newPasswordForm').onsubmit=async e=>{
   e.preventDefault();const first=$('newPassword').value,second=$('confirmPassword').value;
   if(first!==second){setAlert('The passwords do not match.',true);return}
   if(first.length<8){setAlert('Use at least eight characters.',true);return}
   const button=$('saveNewPassword');button.disabled=true;button.textContent='Updating…';
   try{
     const {error}=await db.auth.updateUser({password:first});if(error)throw error;
     recoveryMode=false;recoveryVerified=false;recoveryError='';cleanRecoveryUrl();
     await db.auth.signOut();state.user=null;reset();renderLogin();
     setAlert('Password updated. Sign in with your new password.');
   }catch(err){setAlert('Password update failed: '+(err.message||String(err)),true);button.disabled=false;button.textContent='Update password'}
 };
}

async function query(table,cols='*'){const {data,error}=await db.from(table).select(cols);if(error)throw Error(`${table}: ${error.message}`);return data||[]}
async function refresh(){state.loading=true;state.error='';render();try{const [members,orgs,leagues,seasons,players]=await Promise.all([query('lhq_organization_members','organization_id,user_id,role'),query('lhq_organizations','id,name'),query('lhq_leagues','id,organization_id,name,status,created_at'),query('lhq_seasons','id,organization_id,league_id,name,status,starts_on,ends_on,created_at'),query('lhq_players','id,organization_id,display_name')]);state.membership=members;state.orgs=orgs;state.leagues=leagues;state.seasons=seasons;state.players=players;let orgAllowed=orgs.some(o=>o.id===state.orgId);if(!orgAllowed)state.orgId=orgs[0]?.id||'';selectAvailable();}catch(e){state.error=e.message||String(e)}finally{state.loading=false;render()}}
function selectAvailable(){const ls=visibleLeagues();if(!ls.some(x=>x.id===state.leagueId))state.leagueId=ls[0]?.id||'';const ss=visibleSeasons();if(!ss.some(x=>x.id===state.seasonId))state.seasonId=ss[0]?.id||''}
const visibleLeagues=()=>state.leagues.filter(l=>l.organization_id===state.orgId&&(state.archived||l.status!=='archived')).sort((a,b)=>a.name.localeCompare(b.name));
const visibleSeasons=()=>state.seasons.filter(s=>s.organization_id===state.orgId&&s.league_id===state.leagueId&&(state.archived||s.status!=='archived')).sort((a,b)=>(b.starts_on||b.created_at).localeCompare(a.starts_on||a.created_at));
function selectedOrg(){return state.orgs.find(x=>x.id===state.orgId)}function selectedLeague(){return state.leagues.find(x=>x.id===state.leagueId)}function selectedSeason(){return state.seasons.find(x=>x.id===state.seasonId)}
function statusBadge(x){return `<span class="badge ${x==='archived'?'archived':x==='active'?'active':''}">${esc(x)}</span>`}
function render(){if(!state.user){renderLogin();return}if(state.loading){$('root').innerHTML='<div class="card"><span class="loader"></span> Loading your League HQ workspace…</div>';return}if(!state.orgs.length){$('root').innerHTML=`<div class="card"><h1>Organization access</h1><p>No organizations are visible to this signed-in account. Check the owner assignment in Supabase or the Row Level Security policies.</p><div id="alerts"></div><button class="btn" id="retry">Retry connection</button></div>`;$('retry').onclick=refresh;if(state.error)setAlert(state.error,true);return}
let tabs=[['overview','Home','⌂'],['players','Players','♙'],['teams','Teams','♧'],['games','Games','▦'],['championship','Championship','♛'],['news','News','✉'],['leagues','Leagues','▤'],['seasons','Seasons','▥'],['playerhub','Player Hub','◈']];
const seasonOptions=visibleSeasons();
$('root').innerHTML=`<div class="workspace-head"><div class="eyebrow">SOVEREIGN SPORTS · LEAGUE OPERATIONS</div><h1>${esc(selectedOrg()?.name||'League HQ')}</h1><p>Director Hub — one workspace for every league and season.</p></div>
<div class="context-panel"><div class="context-top">
<label class="field"><span class="label">Organization</span><select id="orgSelect">${state.orgs.map(x=>`<option value="${esc(x.id)}" ${x.id===state.orgId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<label class="field"><span class="label">League</span><select id="leagueSelect"><option value="">Choose league</option>${visibleLeagues().map(x=>`<option value="${esc(x.id)}" ${x.id===state.leagueId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<label class="field"><span class="label">Season</span><select id="seasonSelect"><option value="">Choose season</option>${seasonOptions.map(x=>`<option value="${esc(x.id)}" ${x.id===state.seasonId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<button class="btn ghost" id="reload" title="Refresh league data">↻ Refresh</button></div>
<div class="context-actions"><label class="row mini"><input type="checkbox" id="showArchived" ${state.archived?'checked':''}> Show archived records</label><span class="badge">${esc(selectedSeason()?.status||'No season selected')}</span></div></div>
<nav class="tabs" aria-label="Director sections">${tabs.map(([id,title,ico])=>`<button class="btn ${state.tab===id?'current':''}" data-tab="${id}"><span class="nav-emoji" aria-hidden="true">${ico}</span>${title}</button>`).join('')}</nav>
<div id="alerts" style="margin-bottom:12px"></div><section id="content">${pageContent()}</section><div class="foot">League HQ v0.4 · Season Operations · All records remain in the independent League HQ Supabase project.</div>`;
wireBase();renderAlert();if(state.error)setAlert(state.error,true)}
function pageContent(){if(state.tab==='leagues')return leaguesPage();if(state.tab==='seasons')return seasonsPage();if(state.tab==='players')return playersPage();if(state.tab==='playerhub')return '<div class="card"><h2>Player Hub · Planned</h2><p>The public Player Hub is deliberately not connected yet. Public standings, schedules and news will come after we create permission-safe publication views.</p><div class="note">Private player directory records remain director-only.</div></div>';return overviewPage()}
function overviewPage(){const leagues=visibleLeagues(),seasons=visibleSeasons(),players=state.players.filter(p=>p.organization_id===state.orgId);return `<div class="hq-home-hero"><div class="eyebrow">ACTIVE WORKSPACE</div><h2>${esc(selectedLeague()?.name||'Choose a league')}</h2><p>${esc(selectedSeason()?.name||'Choose or create a season')} ${selectedSeason()?.starts_on?' · '+esc(selectedSeason().starts_on):''} ${selectedSeason()?.ends_on?'– '+esc(selectedSeason().ends_on):''}</p></div>
<div class="workspace-label">Director workspaces</div><div class="home-tiles">
<button class="home-tile featured" data-goto="seasons"><span class="tileicon">▤</span><strong>Season Management</strong><small>Create, select, archive and restore seasons</small></button>

function leaguesPage(){return `<div class="split"><div class="card"><h2>Leagues</h2><p class="mini">Select a league for the rest of the app. Archived leagues remain restorable.</p><div class="stack">${visibleLeagues().map(l=>`<div class="item ${l.id===state.leagueId?'selected':''}"><div class="row between"><strong>${esc(l.name)}</strong>${statusBadge(l.status)}</div><div class="actions"><button class="btn" data-select-league="${esc(l.id)}">Select</button><button class="btn ${l.status==='archived'?'ghost':'danger'}" data-league-status="${esc(l.id)}" data-target="${l.status==='archived'?'active':'archived'}" data-write>${l.status==='archived'?'Restore':'Archive'}</button></div></div>`).join('')||'<div class="empty">No leagues yet. Create one below.</div>'}</div></div><div class="card"><h2>Add league</h2><p class="mini">Create another program under the selected organization.</p><form id="createLeague"><label class="field"><span class="label">League name</span><input name="name" maxlength="160" placeholder="e.g. Danville Volleyball" required></label><button class="btn primary" type="submit" data-write>Create league</button></form></div></div>`}
function seasonsPage(){if(!state.leagueId)return '<div class="card"><h2>Choose or create a league first</h2><p>Seasons always belong to a specific league.</p><button class="btn primary" data-goto="leagues">Manage leagues</button></div>';return `<div class="split"><div class="card"><h2>Seasons · ${esc(selectedLeague()?.name||'')}</h2><p class="mini">Choose a season. Completed seasons may be archived or restored.</p><div class="stack">${visibleSeasons().map(s=>`<div class="item ${s.id===state.seasonId?'selected':''}"><div class="row between"><strong>${esc(s.name)}</strong>${statusBadge(s.status)}</div><div class="mini muted">${esc(s.starts_on||'Date not set')} ${s.ends_on?'→ '+esc(s.ends_on):''}</div><div class="actions"><button class="btn" data-select-season="${esc(s.id)}">Select</button><button class="btn ${s.status==='archived'?'ghost':'danger'}" data-season-status="${esc(s.id)}" data-target="${s.status==='archived'?'draft':'archived'}" data-write>${s.status==='archived'?'Restore to draft':'Archive'}</button></div></div>`).join('')||'<div class="empty">No seasons for this league.</div>'}</div></div><div class="card"><h2>Create season</h2><form id="createSeason"><label class="field"><span class="label">Season name</span><input name="name" maxlength="160" placeholder="e.g. Spring 2027" required></label><label class="field"><span class="label">Starts on (optional)</span><input name="starts_on" type="date"></label><label class="field"><span class="label">Ends on (optional)</span><input name="ends_on" type="date"></label><button class="btn primary" type="submit" data-write>Create draft season</button></form><div class="divider"></div><p class="mini">Archive is reversible. Permanent deletion is intentionally unavailable in this first build.</p></div></div>`}
function playersPage(){const rows=state.players.filter(p=>p.organization_id===state.orgId).sort((a,b)=>a.display_name.localeCompare(b.display_name));return `<div class="card"><div class="row between"><h2>Player Directory</h2><span class="badge">Director-only</span></div><p>Persistent player profiles. Season participation, assignment groups, and Jotform imports are next-phase features.</p>${rows.length?`<div class="stack">${rows.map(p=>`<div class="item">${esc(p.display_name)}</div>`).join('')}</div>`:'<div class="empty">No players registered yet.</div>'}<div class="note" style="margin-top:14px">No automatic team-balancing algorithm will be added. Directors will assign players and groups manually.</div></div>`}
function wireBase(){$('orgSelect').onchange=e=>{state.orgId=e.target.value;selectAvailable();render()};$('leagueSelect').onchange=e=>{state.leagueId=e.target.value;selectAvailable();render()};$('seasonSelect').onchange=e=>{state.seasonId=e.target.value;render()};$('showArchived').onchange=e=>{state.archived=e.target.checked;selectAvailable();render()};$('reload').onclick=refresh;document.querySelectorAll('[data-tab],[data-goto]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab||b.dataset.goto;render()});document.querySelectorAll('[data-select-league]').forEach(b=>b.onclick=()=>{state.leagueId=b.dataset.selectLeague;state.seasonId='';selectAvailable();state.tab='seasons';render()});document.querySelectorAll('[data-select-season]').forEach(b=>b.onclick=()=>{state.seasonId=b.dataset.selectSeason;render()});document.querySelectorAll('[data-league-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_leagues',b.dataset.leagueStatus,b.dataset.target));document.querySelectorAll('[data-season-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_seasons',b.dataset.seasonStatus,b.dataset.target));if($('createLeague'))$('createLeague').onsubmit=createLeague;if($('createSeason'))$('createSeason').onsubmit=createSeason}
async function action(fn,success){if(state.busy)return;busy(true);try{await fn();await refresh();setAlert(success)}catch(e){setAlert(e.message||String(e),true)}finally{busy(false)}}
async function createLeague(e){e.preventDefault();const fd=new FormData(e.currentTarget);const name=String(fd.get('name')||'').trim();if(!name)return;await action(async()=>{const {data,error}=await db.from('lhq_leagues').insert({organization_id:state.orgId,name,status:'active'}).select('id').single();if(error)throw error;state.leagueId=data.id;state.seasonId='';state.tab='seasons'},'League created.')}
async function createSeason(e){e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim(),starts_on=f.get('starts_on')||null,ends_on=f.get('ends_on')||null;if(!name)return;if(starts_on&&ends_on&&ends_on<starts_on){setAlert('End date must be after the start date.',true);return}await action(async()=>{const {data,error}=await db.from('lhq_seasons').insert({organization_id:state.orgId,league_id:state.leagueId,name,status:'draft',starts_on,ends_on}).select('id').single();if(error)throw error;state.seasonId=data.id},'Draft season created.')}
async function changeStatus(table,id,target){if(!confirm(`Change this ${table==='lhq_leagues'?'league':'season'} to ${target}?`))return;await action(async()=>{const {error}=await db.from(table).update({status:target,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',state.orgId);if(error)throw error},`${table==='lhq_leagues'?'League':'Season'} updated.`)}

async function saveRecord(table,row){const {error}=await db.from(table).insert(row);if(error)throw error}

async function deleteRecord(table,id){const {error}=await db.from(table).delete().eq('id',id).eq('organization_id',state.orgId);if(error)throw error}

function teamCards(){const regs=regRows(), members=seasonRows('members');return seasonRows('teams').map(t=>{const roster=members.filter(m=>m.team_id===t.id);return `<div class="item"><div class="row between"><strong>${esc(t.name)}</strong><span class="badge">${esc(t.registration_type)}</span></div><p class="mini">${roster.length} players assigned</p><div class="mini muted">${roster.map(m=>esc(playerName(m.player_id))).join(' · ')||'No players assigned yet'}</div><div class="actions"><button class="btn" data-remove-team="${esc(t.id)}">Delete empty team</button></div></div>`}).join('')||'<div class="empty">No teams yet. Create one to begin assigning players.</div>'}
function playersPage(){const rows=state.players.filter(p=>p.organization_id===state.orgId).sort((a,b)=>a.display_name.localeCompare(b.display_name)), regs=regRows();return `<div class="workspace-head"><div class="eyebrow">PLAYER DIRECTORY & INTAKE</div><h1>Players</h1><p>Profiles persist across seasons; registrations do not.</p></div><div class="split"><div class="card"><h2>Add player profile</h2><form id="addPlayer"><label class="field"><span class="label">Display name</span><input name="display_name" maxlength="160" required placeholder="Player name"></label><button class="btn primary" data-write>Add player</button></form><div class="divider"></div><h2>Season registrations</h2><p class="mini">Register an existing player in the selected season.</p><form id="registerPlayer"><label class="field"><span class="label">Player</span><select name="player_id" required>${optionRows(rows,x=>x.id,x=>x.display_name)}</select></label><button class="btn primary" data-write ${!ready()||!rows.length?'disabled':''}>Register for this season</button></form><p class="mini">Registered this season: <strong>${regs.length}</strong></p></div><div class="card"><h2>Player directory (${rows.length})</h2><div class="stack">${rows.map(p=>{const history=model.registrations.filter(r=>r.player_id===p.id);const now=regs.some(r=>r.player_id===p.id);return `<div class="item row between"><div><strong>${esc(p.display_name)}</strong><span class="mini muted">${history.length} season registration${history.length===1?'':'s'} ${now?' · Current season':''}</span></div>${now?'<span class="badge active">Registered</span>':''}</div>`}).join('')||'<div class="empty">No profiles yet</div>'}</div></div></div><div class="card" style="margin-top:15px"><h2>Bulk individual intake</h2><p class="mini">Paste one player name per line. Existing names in this organization are reused when an exact case-insensitive match exists. All imported names are registered to the selected season. Review before importing; duplicate names may refer to different people.</p><form id="bulkIntake"><label class="field"><span class="label">Names (one per line)</span><textarea name="names" rows="6" required placeholder="Alex Morgan&#10;Taylor Brooks" style="width:100%;border:1px solid #cbd5e3;border-radius:12px;padding:12px;font:inherit"></textarea></label><button class="btn primary" data-write ${!ready()?'disabled':''}>Import names & register</button></form><div class="note" style="margin-top:12px">Jotform connection is deferred. This bulk intake is a manual bridge, not a connected Jotform import.</div></div>`}
function assignmentWarnings(){const warnings=[];const mem=seasonRows('members'), gr=seasonRows('groups'), gm=seasonRows('groupMembers');for(const g of gr.filter(g=>g.preference==='required')){const ids=gm.filter(x=>x.group_id===g.id).map(x=>x.player_id), locations=[...new Set(ids.map(id=>mem.find(m=>m.player_id===id)?.team_id||''))];if(locations.filter(Boolean).length>1 || (locations.some(Boolean)&&locations.includes('')))warnings.push(g.label+' is split across teams / unassigned players.');}return warnings}
function teamsPage(){if(!ready())return emptySeason();const regs=regRows(),teams=seasonRows('teams'),members=seasonRows('members'),groups=seasonRows('groups'),gm=seasonRows('groupMembers'),unassigned=regs.filter(r=>!members.some(m=>m.player_id===r.player_id));const warnings=assignmentWarnings();return `<div class="workspace-head"><div class="eyebrow">DIRECTOR HUB</div><h1>Team Assignment</h1><p>Player and group placements remain 100% director-controlled.</p></div>${warnings.map(w=>`<div class="note error">Required group warning: ${esc(w)}</div>`).join('')}<div class="stats-mini"><div class="card"><div class="mini muted">Registered</div><div class="stat">${regs.length}</div></div><div class="card"><div class="mini muted">Teams</div><div class="stat">${teams.length}</div></div><div class="card"><div class="mini muted">Unassigned</div><div class="stat">${unassigned.length}</div></div></div><div class="split" style="margin-top:15px"><div class="card"><h2>Create team</h2><form id="addTeam"><label class="field"><span class="label">Team name</span><input name="name" required maxlength="160" placeholder="Team name"></label><label class="field"><span class="label">Registration model</span><select name="registration_type"><option value="individual">Director-assigned individuals</option><option value="team">Pre-registered team</option></select></label><button class="btn primary" data-write>Create team</button></form><div class="divider"></div><h2>Assign or move a player</h2><form id="assignPlayer"><label class="field"><span class="label">Player</span><select name="player_id">${optionRows(regs,x=>x.player_id,x=>playerName(x.player_id))}</select></label><label class="field"><span class="label">Destination</span><select name="team_id"><option value="">Unassigned</option>${optionRows(teams,x=>x.id,x=>x.name)}</select></label><button class="btn primary" data-write ${!regs.length?'disabled':''}>Save assignment</button></form><div class="note">Required groups generate warnings when split, but the director decides placements. No automatic balancing or team movement.</div></div><div class="card"><h2>Current teams</h2><div class="stack">${teamCards()}</div></div></div><div class="split" style="margin-top:15px"><div class="card"><h2>Assignment groups</h2><p class="mini">Required = keep together; preferred = requested, but flexible. Groups only apply to this season.</p><form id="createGroup"><label class="field"><span class="label">Group label</span><input name="label" maxlength="160" placeholder="e.g. Morgan household" required></label><label class="field"><span class="label">Preference</span><select name="preference"><option value="required">Required</option><option value="preferred">Preferred</option></select></label><button class="btn primary" data-write>Create group</button></form><div class="divider"></div><h3>Add player to a group</h3><form id="groupMember"><label class="field"><span class="label">Group</span><select name="group_id">${optionRows(groups,x=>x.id,x=>x.label)}</select></label><label class="field"><span class="label">Player</span><select name="player_id">${optionRows(regs,x=>x.player_id,x=>playerName(x.player_id))}</select></label><button class="btn primary" data-write ${!groups.length||!regs.length?'disabled':''}>Add to group</button></form></div><div class="card"><h2>Season groups</h2><div class="stack">${groups.map(g=>`<div class="item"><div class="row between"><strong>${esc(g.label)}</strong><span class="badge">${esc(g.preference)}</span></div><div class="mini">${gm.filter(x=>x.group_id===g.id).map(x=>esc(playerName(x.player_id))).join(' · ')||'No members yet'}</div><div class="actions"><button class="btn danger" data-remove-group="${esc(g.id)}">Delete group</button></div></div>`).join('')||'<div class="empty">No groups yet</div>'}</div></div></div><div class="card" style="margin-top:15px"><h2>Unassigned players</h2><p>${unassigned.map(r=>esc(playerName(r.player_id))).join(' · ')||'All registered players are assigned.'}</p></div>`}
function matchRows(stage){return seasonRows('matches').filter(m=>m.stage===stage).sort((a,b)=>a.match_date.localeCompare(b.match_date)||(a.start_time||'').localeCompare(b.start_time||''))}
function standingsRows(){const teams=seasonRows('teams');const rows=teams.map(t=>({id:t.id,name:t.name,played:0,wins:0,losses:0,points:0}));for(const m of matchRows('regular').filter(m=>m.status==='completed')){const a=rows.find(x=>x.id===m.home_team_id),b=rows.find(x=>x.id===m.away_team_id);if(!a||!b)continue;a.played++;b.played++;const w=Number(m.home_score)>Number(m.away_score)?a:b;const l=w===a?b:a;w.wins++;w.points++;l.losses++}rows.sort((a,b)=>b.points-a.points||b.wins-a.wins||a.losses-b.losses||a.name.localeCompare(b.name));return rows}
function matchCard(m){return `<div class="item"><div class="row between"><div><strong>${esc(teamName(m.home_team_id))} vs ${esc(teamName(m.away_team_id))}</strong><div class="mini muted">${esc(m.match_date)} ${esc((m.start_time||'').slice(0,5))} ${esc(m.court||'')} ${m.stage==='championship'?' · '+esc(m.round_label||'Championship'):''}</div></div>${statusBadge(m.status)}</div>${m.status==='completed'?`<p class="mini">Result: ${esc(m.home_score)} – ${esc(m.away_score)} · Winner: ${esc(teamName(m.home_score>m.away_score?m.home_team_id:m.away_team_id))}</p>`:''}<div class="actions"><button class="btn" data-score-match="${esc(m.id)}">${m.status==='completed'?'Correct result':'Enter result'}</button><button class="btn danger" data-delete-match="${esc(m.id)}">Delete match</button></div></div>`}
function matchCreateForm(stage){const teams=seasonRows('teams');return `<form class="addMatch" data-stage="${stage}"><div class="split"><label class="field"><span class="label">Home</span><select name="home_team_id">${optionRows(teams,x=>x.id,x=>x.name)}</select></label><label class="field"><span class="label">Away</span><select name="away_team_id">${optionRows(teams,x=>x.id,x=>x.name)}</select></label></div><div class="split"><label class="field"><span class="label">Date</span><input type="date" name="match_date" value="${esc(selectedSeason()?.starts_on||'')}" required></label><label class="field"><span class="label">Start time (optional)</span><input type="time" name="start_time"></label></div><div class="split"><label class="field"><span class="label">Court (optional)</span><input name="court" maxlength="80" placeholder="Court 1"></label>${stage==='championship'?'<label class="field"><span class="label">Round / bracket slot</span><input name="round_label" maxlength="80" placeholder="Semi-final 1"></label>':'<div></div>'}</div><button class="btn primary" data-write ${teams.length<2?'disabled':''}>Add ${stage==='regular'?'weekly':'championship'} match</button></form>`}
function gamesPage(){if(!ready())return emptySeason();const games=matchRows('regular'),rows=standingsRows();return `<div class="workspace-head"><div class="eyebrow">SEASON OPERATIONS</div><h1>Games & Standings</h1><p>Schedule weekly matches and record winners. No team-balancing automation.</p></div><div class="split"><div class="card"><h2>Schedule a match</h2>${matchCreateForm('regular')}</div><div class="card"><h2>Regular season standings</h2><p class="mini">Current provisional rule: one point per completed match win. Configurable points and tiebreakers are a later step; don't use this as an official season calculation until those are approved.</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th>Team</th><th>W</th><th>L</th><th>Pts</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.wins}</td><td>${x.losses}</td><td>${x.points}</td></tr>`).join('')}</tbody></table></div></div></div><div class="card" style="margin-top:15px"><h2>Scheduled and completed games (${games.length})</h2><div class="stack">${games.map(matchCard).join('')||'<div class="empty">No games scheduled</div>'}</div></div>`}
function championshipPage(){if(!ready())return emptySeason();const matches=matchRows('championship'),stand=standingsRows();return `<div class="workspace-head"><div class="eyebrow">SEASON FINALE</div><h1>Championship</h1><p>A championship competition within this season; not a second Tournament HQ event.</p></div><div class="card"><h2>Seed reference</h2><p class="mini">Preview using provisional regular-season standings. Directors decide final seeding and matchups.</p>${stand.map((x,i)=>`<div class="item"><strong>#${i+1} ${esc(x.name)}</strong><span class="mini">${x.wins} match wins · ${x.points} provisional points</span></div>`).join('')}<div class="note" style="margin-top:12px">This release supports director-entered championship fixtures and results. Automated bracket generation, advancement, and double-elimination are not implemented yet. We will adapt Tournament HQ's bracket engine in the next competition release.</div></div><div class="split" style="margin-top:15px"><div class="card"><h2>Add championship fixture</h2>${matchCreateForm('championship')}</div><div class="card"><h2>Championship results</h2><div class="stack">${matches.map(matchCard).join('')||'<div class="empty">No championship matches yet</div>'}</div></div></div>`}
function newsPage(){if(!ready())return emptySeason();const rows=seasonRows('news').sort((a,b)=>b.created_at.localeCompare(a.created_at));return `<div class="workspace-head"><div class="eyebrow">COMMUNITY UPDATES</div><h1>News & Updates</h1><p>Write and publish season announcements. Player-facing public feed will be enabled only after a separate security review.</p></div><div class="split"><div class="card"><h2>New announcement</h2><form id="addNews"><label class="field"><span class="label">Headline</span><input name="title" maxlength="160" required></label><label class="field"><span class="label">Message</span><textarea name="body" rows="6" maxlength="10000" style="width:100%;padding:12px;border:1px solid #cbd5e3;border-radius:12px;font:inherit" required></textarea></label><label class="field"><span class="label">Status</span><select name="status"><option value="draft">Save draft</option><option value="published">Publish to director feed</option></select></label><button class="btn primary" data-write>Save announcement</button></form></div><div class="card"><h2>Season announcements (${rows.length})</h2><div class="stack">${rows.map(n=>`<div class="item"><div class="row between"><strong>${esc(n.title)}</strong>${statusBadge(n.status)}</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><div class="actions"><button class="btn" data-news-toggle="${esc(n.id)}" data-news-status="${n.status==='published'?'draft':'published'}">${n.status==='published'?'Move to draft':'Publish'}</button><button class="btn danger" data-news-remove="${esc(n.id)}">Delete</button></div></div>`).join('')||'<div class="empty">No updates yet</div>'}</div></div></div>`}

 const bind=(selector,fn)=>document.querySelectorAll(selector).forEach(el=>el.addEventListener('click',()=>fn(el)));
 const form=(id,handler)=>{if($(id))$(id).onsubmit=handler};
 form('addPlayer',e=>{e.preventDefault();const n=new FormData(e.target).get('display_name').trim();if(n)action(()=>saveRecord('lhq_players',{organization_id:state.orgId,display_name:n}),'Player added.')});
 form('registerPlayer',e=>{e.preventDefault();if(!ready())return;const id=new FormData(e.target).get('player_id');if(id)action(async()=>{const r=model.registrations.find(x=>x.season_id===state.seasonId&&x.player_id===id);if(r){if(r.registration_status==='registered')throw Error('This player is already registered.');await updateRecord('lhq_season_players',r.id,{registration_status:'registered'});return}await saveRecord('lhq_season_players',{...newScope(),player_id:id})},'Player registered.')});
 form('bulkIntake',e=>{e.preventDefault();if(!ready())return;const lines=String(new FormData(e.target).get('names')||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const unique=[...new Set(lines.map(x=>x.toLocaleLowerCase()))];if(unique.length!==lines.length){setAlert('Duplicate names in the import. Remove duplicates and try again.',true);return}if(lines.length>150){setAlert('Limit each import to 150 names.',true);return}if(!confirm(`Register ${lines.length} listed player(s) for this season? Review names carefully; exact names may represent different people.`))return;action(async()=>{for(const name of lines){let existing=state.players.find(p=>p.organization_id===state.orgId&&p.display_name.toLocaleLowerCase()===name.toLocaleLowerCase());let playerId=existing?.id;if(!playerId){const {data,error}=await db.from('lhq_players').insert({organization_id:state.orgId,display_name:name}).select('id').single();if(error)throw error;playerId=data.id;state.players.push({id:playerId,organization_id:state.orgId,display_name:name})}if(model.registrations.some(r=>r.season_id===state.seasonId&&r.player_id===playerId))continue;await saveRecord('lhq_season_players',{...newScope(),player_id:playerId,registration_source:'csv'})}},'Bulk intake processed. Refresh the roster to verify.')});
 form('addTeam',e=>{e.preventDefault();const f=new FormData(e.target);action(()=>saveRecord('lhq_teams',{...newScope(),name:String(f.get('name')).trim(),registration_type:f.get('registration_type')}),'Team created.')});
 form('assignPlayer',e=>{e.preventDefault();const f=new FormData(e.target),pid=f.get('player_id'),team=f.get('team_id');if(!pid)return;action(async()=>{const existing=seasonRows('members').find(m=>m.player_id===pid);if(existing){await deleteRecord('lhq_team_members',existing.id)}if(team)await saveRecord('lhq_team_members',{...newScope(),player_id:pid,team_id:team})},team?'Player assigned.':'Player unassigned.')});
 form('createGroup',e=>{e.preventDefault();const f=new FormData(e.target);action(()=>saveRecord('lhq_assignment_groups',{...newScope(),label:String(f.get('label')).trim(),preference:f.get('preference')}),'Group created.')});
 form('groupMember',e=>{e.preventDefault();const f=new FormData(e.target),groupId=f.get('group_id'),playerId=f.get('player_id');if(!groupId||!playerId)return;action(()=>saveRecord('lhq_assignment_group_members',{...newScope(),group_id:groupId,player_id:playerId}),'Player added to assignment group.')});
 document.querySelectorAll('.addMatch').forEach(el=>el.onsubmit=e=>{e.preventDefault();const f=new FormData(el),home=f.get('home_team_id'),away=f.get('away_team_id');if(home===away){setAlert('Choose two different teams.',true);return}action(()=>saveRecord('lhq_matches',{...newScope(),home_team_id:home,away_team_id:away,match_date:f.get('match_date'),start_time:f.get('start_time')||null,court:String(f.get('court')||'').trim(),stage:el.dataset.stage,round_label:String(f.get('round_label')||'').trim()}),'Match scheduled.')});
 form('addNews',e=>{e.preventDefault();const f=new FormData(e.target);action(()=>saveRecord('lhq_news',{...newScope(),title:String(f.get('title')||'').trim(),body:String(f.get('body')||'').trim(),status:f.get('status')}),'News saved.')});
 bind('[data-remove-team]',el=>{const id=el.dataset.removeTeam;if(seasonRows('members').some(x=>x.team_id===id)||seasonRows('matches').some(x=>x.home_team_id===id||x.away_team_id===id)){setAlert('Only empty, unused teams may be deleted.',true);return}if(confirm('Delete this empty team?'))action(()=>deleteRecord('lhq_teams',id),'Team deleted.')});
 bind('[data-remove-group]',el=>{if(confirm('Delete this assignment group?'))action(()=>deleteRecord('lhq_assignment_groups',el.dataset.removeGroup),'Group deleted.')});
 bind('[data-score-match]',el=>{const m=model.matches.find(x=>x.id===el.dataset.scoreMatch);if(!m)return;const a=prompt(`Score for ${teamName(m.home_team_id)} (e.g. sets won)`,m.home_score??'');if(a===null)return;const b=prompt(`Score for ${teamName(m.away_team_id)}`,m.away_score??'');if(b===null)return;const x=Number(a),y=Number(b);if(!/^\d+$/.test(a)||!/^\d+$/.test(b)||x===y){setAlert('Enter different nonnegative integer scores for each team.',true);return}if(!confirm(`Save ${teamName(m.home_team_id)} ${x} – ${y} ${teamName(m.away_team_id)}?`))return;action(()=>updateRecord('lhq_matches',m.id,{home_score:x,away_score:y,status:'completed',updated_at:new Date().toISOString()}),'Result saved.')});
 bind('[data-delete-match]',el=>{if(confirm('Delete this match and any result?'))action(()=>deleteRecord('lhq_matches',el.dataset.deleteMatch),'Match deleted.')});
 bind('[data-news-toggle]',el=>action(()=>updateRecord('lhq_news',el.dataset.newsToggle,{status:el.dataset.newsStatus,updated_at:new Date().toISOString()}),'News status updated.'));
 bind('[data-news-remove]',el=>{if(confirm('Delete this announcement?'))action(()=>deleteRecord('lhq_news',el.dataset.newsRemove),'Announcement deleted.')});
};
const v03PageContent=pageContent;
pageContent=function(){if(state.tab==='teams')return teamsPage();if(state.tab==='games')return gamesPage();if(state.tab==='championship')return championshipPage();if(state.tab==='news')return newsPage();return v03PageContent()};
const v03Overview=overviewPage;
overviewPage=function(){const initial=v03Overview();return initial.replace('<div class="home-tile upcoming"><span class="tileicon">♧</span><strong>Team Assignment</strong><small>Manual director-controlled assignments · coming next</small></div>', '<button class="home-tile" data-goto="teams"><span class="tileicon">♧</span><strong>Team Assignment</strong><small>Teams, players and required/preferred groups</small></button>')
.replace('<div class="home-tile upcoming"><span class="tileicon">▦</span><strong>Schedule & Results</strong><small>Season-based match operations · upcoming</small></div>','<button class="home-tile" data-goto="games"><span class="tileicon">▦</span><strong>Schedule & Results</strong><small>Weekly games and standings</small></button><button class="home-tile" data-goto="championship"><span class="tileicon">♛</span><strong>Championship</strong><small>Playoff fixtures and results</small></button><button class="home-tile" data-goto="news"><span class="tileicon">✉</span><strong>News & Updates</strong><small>Draft and publish season notices</small></button>')
.replace('This is our Tournament HQ-style Director shell. Team assignments, scheduling, and the Player Hub are planned workspaces—not functional modules yet. Team composition remains entirely director-controlled.', 'Season operations are now available. Team composition remains director-controlled; the public Player Hub and automated bracket advancement are future releases.')};

init();
</script></body></html>
