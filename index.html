<style>

es spin{to{transform:rotate(360deg)}}@media(max-width:620px){.split{grid-template-columns:1fr}.top .shell{padding:14px}.brand{font-size:18px}.brand small{font-size:9px}.shell{padding-top:14px}.card{padding:15px}.toolbar>*{flex:1 1 100%}.toolbar button{flex:1}}

/* League HQ v0.3 — Tournament HQ Director Experience inspired shell */
:root{--panel:#fff;--navy:#132a4b;--gold:#f0bd35;--line:#dce3ec}
.top .shell{max-width:1100px}.top{box-shadow:0 3px 16px #19375612}.shell{padding-bottom:112px}
.workspace-head{margin:8px 0 16px}.workspace-head .eyebrow{font-size:11px;letter-spacing:1.5px;color:#717f94}.workspace-head h1{margin:4px 0;font-size:clamp(26px,5vw,35px);font-weight:950}.workspace-head p{margin:0;font-size:14px}
.context-panel{border:1px solid #dce5ef;border-radius:19px;background:linear-gradient(130deg,#fff,#f4f7fb);padding:17px;margin:0 0 16px}.context-top{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}.context-panel .field{margin:0}.context-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}.context-actions .btn{min-height:40px}.context-actions input{width:auto;min-height:auto}
.tabs{display:flex;overflow-x:auto;flex-wrap:nowrap;gap:8px;padding:10px 0 2px;scrollbar-width:none}.tabs .btn{white-space:nowrap;background:#f3f6fa;border:1px solid #e1e6ed;border-radius:13px;color:var(--navy);font-weight:800;min-height:44px}.tabs .btn.current{background:var(--navy);border-color:var(--navy);color:white}
.hq-home-hero{border:1px solid #dce5ef;background:linear-gradient(130deg,#fff,#f4f7fb);border-radius:19px;padding:20px;margin-bottom:16px}.hq-home-hero h2{font-size:23px;margin:7px 0}.hq-home-hero p{margin:0;font-size:14px}.home-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 20px}.home-tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:8px;min-height:138px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 16px;text-align:left;color:var(--navy);box-shadow:0 3px 14px #122a4710}.home-tile strong{font-size:16px}.home-tile small{color:#718097;font-size:12px;line-height:1.45}.home-tile .tileicon{background:#e9edf5;border-radius:13px;display:flex;align-items:center;justify-content:center;width:46px;height:46px;font-size:23px}.home-tile.featured{background:var(--navy);color:#fff}.home-tile.featured small{color:#ccd6e5}.home-tile.featured .tileicon{background:#ffffff1b}.home-tile:hover,.home-tile:focus-visible{border-color:#c69a43;box-shadow:0 7px 22px #14254218}
.home-tile.upcoming{background:#f7f9fc;border-style:dashed;box-shadow:none;cursor:default}.workspace-label{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#65738a;font-weight:850;margin:16px 0 9px}.workspace-context{margin-bottom:16px}.stats-mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stats-mini .card{padding:15px}.stats-mini .stat{font-size:26px}.section-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 13px}.section-heading h2{margin:0}.foot{margin-top:22px}
@media(max-width:750px){.context-top{grid-template-columns:1fr 1fr}.home-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.top .shell{padding:12px 14px}.context-top{grid-template-columns:1fr 1fr}.context-top .field:first-child{grid-column:span 2}.context-top .btn{width:100%}.context-panel{padding:13px}.home-tiles{gap:9px}.home-tile{min-height:125px;padding:14px}.home-tile strong{font-size:15px}.home-tile small{font-size:12px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:12;background:#fff;border-top:1px solid #dce3ec;box-shadow:0 -5px 28px #1b36521f;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:4px}.tabs .btn{border:0;min-width:0;flex:1 1 20%;padding:7px 2px;background:transparent;border-radius:11px;display:flex;align-items:center;flex-direction:column;gap:3px;font-size:10px;white-space:normal;min-height:51px}.tabs .btn.current{background:#e9eef7;color:var(--navy);border:0}.tabs .nav-emoji{font-size:20px;line-height:1.2}.stats-mini{grid-template-columns:repeat(3,minmax(0,1fr))}.stats-mini .card{padding:10px}.stats-mini .stat{font-size:22px}}
</style></head><body><header class="top"><div class="shell"><div class="brand"><span class="mark">♛</span>LEAGUE HQ<small>DIRECTOR + PLAYER HUB</small></div><div class="row"><span id="who" class="mini muted"></span><button id="logout" class="btn ghost hide">Sign out</button></div></div></header><main id="root" class="shell"><div class="card">Connecting…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
// Supabase browser publishable key: never include service-role or secret keys.
const PROJECT_URL='https://sfukoetvqhtyunyatvup.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_tAQnKyT7aRSeYIf68IfObQ_wOA7LHNB';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tab:'overview',orgs:[],membership:[],leagues:[],seasons:[],players:[],orgId:'',leagueId:'',seasonId:'',archived:false,busy:false,loading:false,error:'',message:'',user:null};
let db;
// Recovery links can use hash tokens or an authorization-code redirect.
const authHash = new URLSearchParams(location.hash.replace(/^#/,''));
const authSearch = new URLSearchParams(location.search);
let recoveryMode = authHash.get('type') === 'recovery' || authSearch.get('type') === 'recovery' || authSearch.get('lhq_action') === 'recover';
let recoveryVerified = false;
let recoveryError = authHash.get('error_description') || authSearch.get('error_description') || '';
const recoveryRedirect = () => location.origin + location.pathname + '?lhq_action=recover';
function cleanRecoveryUrl(){history.replaceState(null,'',location.pathname);}

const opts={auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}};
function setAlert(message,error=false){state.message=error?'':message;state.error=error?message:'';renderAlert();}
function renderAlert(){const el=$('alerts');if(el)el.innerHTML=(state.error?`<div class="note error" role="alert">${esc(state.error)}</div>`:state.message?`<div class="note success" role="status">${esc(state.message)}</div>`:'');}
function busy(on){state.busy=on;document.querySelectorAll('button[data-write]').forEach(x=>x.disabled=on)}
async function init(){
 if(!window.supabase?.createClient){$('root').innerHTML='<div class="note error">Could not load the Supabase client library. Check your internet connection or content-blocking settings.</div>';return}
 db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,opts);
 $('logout').addEventListener('click',async()=>{await db.auth.signOut();recoveryMode=false;recoveryVerified=false;cleanRecoveryUrl();state.user=null;reset();render()});
 db.auth.onAuthStateChange((event,session)=>{
   state.user=session?.user||null;updateHeader();
   if(event==='PASSWORD_RECOVERY'){
     recoveryMode=true;recoveryVerified=!!session?.user;
     // Defer DOM updates until the auth callback finishes.
     setTimeout(()=>renderPasswordRecovery(),0);
   }
 });
 const {data,error}=await db.auth.getSession();
 if(error){renderLogin(error.message);return}
 state.user=data.session?.user||null;updateHeader();
 if(recoveryMode){
   // An authenticated session is required before updateUser can change the password.
   recoveryVerified=!!data.session?.user;
   renderPasswordRecovery();return;
 }
 if(state.user)await refresh();else renderLogin();
}
function updateHeader(){$('who').textContent=state.user?.email||'';$('logout').classList.toggle('hide',!state.user)}
function reset(){state.orgs=[];state.membership=[];state.leagues=[];state.seasons=[];state.players=[];state.orgId='';state.leagueId='';state.seasonId='';state.error='';state.message='';state.tab='overview';updateHeader()}
function renderLogin(msg=''){$('root').innerHTML=`<div class="card login"><div class="eyebrow">Sovereign Sports · Development</div><h1>Director sign in</h1><p>Use the application user you created in the new League HQ Supabase project.</p><form id="loginForm"><label class="field"><span class="label">Email address</span><input id="email" type="email" autocomplete="username" required></label><label class="field"><span class="label">Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" id="loginBtn">Sign in</button></form><p style="margin-top:12px"><button class="btn ghost" id="forgotPassword" type="button">Forgot password?</button></p><div id="alerts" style="margin-top:14px"></div><div class="foot">Version 0.3 · Director foundation · Not a public player portal</div></div>`;if(msg)setAlert(msg,true);$('forgotPassword').onclick=renderForgotPassword;$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){b.disabled=false;b.textContent='Sign in';setAlert(error.message,true);return}state.user=data.user;updateHeader();await refresh()}}
function renderForgotPassword(){
 $('root').innerHTML=`<div class="card login"><div class="eyebrow">League HQ · Account recovery</div><h1>Reset your password</h1><p>Enter the email for your League HQ Director Hub login. We’ll email a one-time recovery link.</p><form id="forgotForm"><label class="field"><span class="label">Email address</span><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn primary" id="sendRecovery" type="submit">Send recovery email</button></form><p style="margin-top:12px"><button class="btn ghost" id="backToLogin" type="button">Back to sign in</button></p><div id="alerts" aria-live="polite"></div><div class="foot">If no email arrives, check spam and Supabase Auth email sending limits. Use the newest recovery email link.</div></div>`;
 $('backToLogin').onclick=()=>renderLogin();
 $('forgotForm').onsubmit=async e=>{
   e.preventDefault();const button=$('sendRecovery');button.disabled=true;button.textContent='Sending…';
   try{
     const email=$('recoveryEmail').value.trim();
     const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:recoveryRedirect()});
     if(error)throw error;
     setAlert('If that address has a League HQ account, a recovery email will be sent. Open the newest link to set your new password.');
   }catch(err){setAlert('Could not send recovery email: '+(err.message||String(err)),true)}
   finally{button.disabled=false;button.textContent='Send recovery email'}
 };
}
function renderPasswordRecovery(){
 const canUpdate=recoveryVerified&&!!state.user;
 $('root').innerHTML=`<div class="card login"><div class="eyebrow">League HQ · Account recovery</div><h1>${canUpdate?'Choose a new password':'Verify recovery link'}</h1>${canUpdate?'<p>Your recovery link was accepted. Enter a new password for your League HQ application account.</p>':'<p>We could not establish a valid recovery session. The link may have expired or already been used. Request a fresh recovery email below.</p>'}${canUpdate?`<form id="newPasswordForm"><label class="field"><span class="label">New password (at least 8 characters)</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="field"><span class="label">Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="btn primary" id="saveNewPassword" type="submit">Update password</button></form>`:'<button class="btn primary" id="requestFreshLink" type="button">Request a new recovery link</button>'}<p style="margin-top:12px"><button class="btn ghost" id="returnToLogin" type="button">Back to sign in</button></p><div id="alerts" aria-live="polite"></div></div>`;
 $('returnToLogin').onclick=async()=>{recoveryMode=false;recoveryVerified=false;cleanRecoveryUrl();await db.auth.signOut();state.user=null;updateHeader();renderLogin()};
 if(!canUpdate){if($('requestFreshLink'))$('requestFreshLink').onclick=()=>{recoveryMode=false;cleanRecoveryUrl();renderForgotPassword()};if(recoveryError)setAlert(decodeURIComponent(recoveryError.replace(/\+/g,' ')),true);return}
 $('newPasswordForm').onsubmit=async e=>{
   e.preventDefault();const first=$('newPassword').value,second=$('confirmPassword').value;
   if(first!==second){setAlert('The passwords do not match.',true);return}
   if(first.length<8){setAlert('Use at least eight characters.',true);return}
   const button=$('saveNewPassword');button.disabled=true;button.textContent='Updating…';
   try{
     const {error}=await db.auth.updateUser({password:first});if(error)throw error;
     recoveryMode=false;recoveryVerified=false;recoveryError='';cleanRecoveryUrl();
     await db.auth.signOut();state.user=null;reset();renderLogin();
     setAlert('Password updated. Sign in with your new password.');
   }catch(err){setAlert('Password update failed: '+(err.message||String(err)),true);button.disabled=false;button.textContent='Update password'}
 };
}

async function query(table,cols='*'){const {data,error}=await db.from(table).select(cols);if(error)throw Error(`${table}: ${error.message}`);return data||[]}
async function refresh(){state.loading=true;state.error='';render();try{const [members,orgs,leagues,seasons,players]=await Promise.all([query('lhq_organization_members','organization_id,user_id,role'),query('lhq_organizations','id,name'),query('lhq_leagues','id,organization_id,name,status,created_at'),query('lhq_seasons','id,organization_id,league_id,name,status,starts_on,ends_on,created_at'),query('lhq_players','id,organization_id,display_name')]);state.membership=members;state.orgs=orgs;state.leagues=leagues;state.seasons=seasons;state.players=players;let orgAllowed=orgs.some(o=>o.id===state.orgId);if(!orgAllowed)state.orgId=orgs[0]?.id||'';selectAvailable();}catch(e){state.error=e.message||String(e)}finally{state.loading=false;render()}}
function selectAvailable(){const ls=visibleLeagues();if(!ls.some(x=>x.id===state.leagueId))state.leagueId=ls[0]?.id||'';const ss=visibleSeasons();if(!ss.some(x=>x.id===state.seasonId))state.seasonId=ss[0]?.id||''}
const visibleLeagues=()=>state.leagues.filter(l=>l.organization_id===state.orgId&&(state.archived||l.status!=='archived')).sort((a,b)=>a.name.localeCompare(b.name));
const visibleSeasons=()=>state.seasons.filter(s=>s.organization_id===state.orgId&&s.league_id===state.leagueId&&(state.archived||s.status!=='archived')).sort((a,b)=>(b.starts_on||b.created_at).localeCompare(a.starts_on||a.created_at));
function selectedOrg(){return state.orgs.find(x=>x.id===state.orgId)}function selectedLeague(){return state.leagues.find(x=>x.id===state.leagueId)}function selectedSeason(){return state.seasons.find(x=>x.id===state.seasonId)}
function statusBadge(x){return `<span class="badge ${x==='archived'?'archived':x==='active'?'active':''}">${esc(x)}</span>`}
function render(){if(!state.user){renderLogin();return}if(state.loading){$('root').innerHTML='<div class="card"><span class="loader"></span> Loading your League HQ workspace…</div>';return}if(!state.orgs.length){$('root').innerHTML=`<div class="card"><h1>Organization access</h1><p>No organizations are visible to this signed-in account. Check the owner assignment in Supabase or the Row Level Security policies.</p><div id="alerts"></div><button class="btn" id="retry">Retry connection</button></div>`;$('retry').onclick=refresh;if(state.error)setAlert(state.error,true);return}
let tabs=[['overview','Home','⌂'],['leagues','Leagues','▦'],['seasons','Seasons','▤'],['players','Players','♙'],['playerhub','Player Hub','◈']];
const seasonOptions=visibleSeasons();
$('root').innerHTML=`<div class="workspace-head"><div class="eyebrow">SOVEREIGN SPORTS · LEAGUE OPERATIONS</div><h1>${esc(selectedOrg()?.name||'League HQ')}</h1><p>Director Hub — one workspace for every league and season.</p></div>
<div class="context-panel"><div class="context-top">
<label class="field"><span class="label">Organization</span><select id="orgSelect">${state.orgs.map(x=>`<option value="${esc(x.id)}" ${x.id===state.orgId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<label class="field"><span class="label">League</span><select id="leagueSelect"><option value="">Choose league</option>${visibleLeagues().map(x=>`<option value="${esc(x.id)}" ${x.id===state.leagueId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<label class="field"><span class="label">Season</span><select id="seasonSelect"><option value="">Choose season</option>${seasonOptions.map(x=>`<option value="${esc(x.id)}" ${x.id===state.seasonId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
<button class="btn ghost" id="reload" title="Refresh league data">↻ Refresh</button></div>
<div class="context-actions"><label class="row mini"><input type="checkbox" id="showArchived" ${state.archived?'checked':''}> Show archived records</label><span class="badge">${esc(selectedSeason()?.status||'No season selected')}</span></div></div>
<nav class="tabs" aria-label="Director sections">${tabs.map(([id,title,ico])=>`<button class="btn ${state.tab===id?'current':''}" data-tab="${id}"><span class="nav-emoji" aria-hidden="true">${ico}</span>${title}</button>`).join('')}</nav>
<div id="alerts" style="margin-bottom:12px"></div><section id="content">${pageContent()}</section><div class="foot">League HQ v0.3 · Director Hub foundation · All records remain in the independent League HQ Supabase project.</div>`;
wireBase();renderAlert();if(state.error)setAlert(state.error,true)}
function pageContent(){if(state.tab==='leagues')return leaguesPage();if(state.tab==='seasons')return seasonsPage();if(state.tab==='players')return playersPage();if(state.tab==='playerhub')return '<div class="card"><h2>Player Hub · Planned</h2><p>The public Player Hub is deliberately not connected yet. Public standings, schedules and news will come after we create permission-safe publication views.</p><div class="note">Private player directory records remain director-only.</div></div>';return overviewPage()}
function overviewPage(){const leagues=visibleLeagues(),seasons=visibleSeasons(),players=state.players.filter(p=>p.organization_id===state.orgId);return `<div class="hq-home-hero"><div class="eyebrow">ACTIVE WORKSPACE</div><h2>${esc(selectedLeague()?.name||'Choose a league')}</h2><p>${esc(selectedSeason()?.name||'Choose or create a season')} ${selectedSeason()?.starts_on?' · '+esc(selectedSeason().starts_on):''} ${selectedSeason()?.ends_on?'– '+esc(selectedSeason().ends_on):''}</p></div>
<div class="workspace-label">Director workspaces</div><div class="home-tiles">
<button class="home-tile featured" data-goto="seasons"><span class="tileicon">▤</span><strong>Season Management</strong><small>Create, select, archive and restore seasons</small></button>
<button class="home-tile" data-goto="leagues"><span class="tileicon">▦</span><strong>Leagues</strong><small>Switch programs and manage leagues</small></button>
<button class="home-tile" data-goto="players"><span class="tileicon">♙</span><strong>Player Directory</strong><small>View persistent player profiles</small></button>
<div class="home-tile upcoming"><span class="tileicon">♧</span><strong>Team Assignment</strong><small>Manual director-controlled assignments · coming next</small></div>
<div class="home-tile upcoming"><span class="tileicon">▦</span><strong>Schedule & Results</strong><small>Season-based match operations · upcoming</small></div>
<button class="home-tile" data-goto="playerhub"><span class="tileicon">◈</span><strong>Player Hub</strong><small>Public experience · upcoming</small></button>
</div><div class="workspace-label">Workspace snapshot</div><div class="stats-mini"><div class="card"><div class="muted mini">Leagues</div><div class="stat">${leagues.length}</div></div><div class="card"><div class="muted mini">Seasons</div><div class="stat">${seasons.length}</div></div><div class="card"><div class="muted mini">Players</div><div class="stat">${players.length}</div></div></div><div class="note" style="margin-top:15px">This is our Tournament HQ-style Director shell. Team assignments, scheduling, and the Player Hub are planned workspaces—not functional modules yet. Team composition remains entirely director-controlled.</div>`}
function leaguesPage(){return `<div class="split"><div class="card"><h2>Leagues</h2><p class="mini">Select a league for the rest of the app. Archived leagues remain restorable.</p><div class="stack">${visibleLeagues().map(l=>`<div class="item ${l.id===state.leagueId?'selected':''}"><div class="row between"><strong>${esc(l.name)}</strong>${statusBadge(l.status)}</div><div class="actions"><button class="btn" data-select-league="${esc(l.id)}">Select</button><button class="btn ${l.status==='archived'?'ghost':'danger'}" data-league-status="${esc(l.id)}" data-target="${l.status==='archived'?'active':'archived'}" data-write>${l.status==='archived'?'Restore':'Archive'}</button></div></div>`).join('')||'<div class="empty">No leagues yet. Create one below.</div>'}</div></div><div class="card"><h2>Add league</h2><p class="mini">Create another program under the selected organization.</p><form id="createLeague"><label class="field"><span class="label">League name</span><input name="name" maxlength="160" placeholder="e.g. Danville Volleyball" required></label><button class="btn primary" type="submit" data-write>Create league</button></form></div></div>`}
function seasonsPage(){if(!state.leagueId)return '<div class="card"><h2>Choose or create a league first</h2><p>Seasons always belong to a specific league.</p><button class="btn primary" data-goto="leagues">Manage leagues</button></div>';return `<div class="split"><div class="card"><h2>Seasons · ${esc(selectedLeague()?.name||'')}</h2><p class="mini">Choose a season. Completed seasons may be archived or restored.</p><div class="stack">${visibleSeasons().map(s=>`<div class="item ${s.id===state.seasonId?'selected':''}"><div class="row between"><strong>${esc(s.name)}</strong>${statusBadge(s.status)}</div><div class="mini muted">${esc(s.starts_on||'Date not set')} ${s.ends_on?'→ '+esc(s.ends_on):''}</div><div class="actions"><button class="btn" data-select-season="${esc(s.id)}">Select</button><button class="btn ${s.status==='archived'?'ghost':'danger'}" data-season-status="${esc(s.id)}" data-target="${s.status==='archived'?'draft':'archived'}" data-write>${s.status==='archived'?'Restore to draft':'Archive'}</button></div></div>`).join('')||'<div class="empty">No seasons for this league.</div>'}</div></div><div class="card"><h2>Create season</h2><form id="createSeason"><label class="field"><span class="label">Season name</span><input name="name" maxlength="160" placeholder="e.g. Spring 2027" required></label><label class="field"><span class="label">Starts on (optional)</span><input name="starts_on" type="date"></label><label class="field"><span class="label">Ends on (optional)</span><input name="ends_on" type="date"></label><button class="btn primary" type="submit" data-write>Create draft season</button></form><div class="divider"></div><p class="mini">Archive is reversible. Permanent deletion is intentionally unavailable in this first build.</p></div></div>`}
function playersPage(){const rows=state.players.filter(p=>p.organization_id===state.orgId).sort((a,b)=>a.display_name.localeCompare(b.display_name));return `<div class="card"><div class="row between"><h2>Player Directory</h2><span class="badge">Director-only</span></div><p>Persistent player profiles. Season participation, assignment groups, and Jotform imports are next-phase features.</p>${rows.length?`<div class="stack">${rows.map(p=>`<div class="item">${esc(p.display_name)}</div>`).join('')}</div>`:'<div class="empty">No players registered yet.</div>'}<div class="note" style="margin-top:14px">No automatic team-balancing algorithm will be added. Directors will assign players and groups manually.</div></div>`}
function wireBase(){$('orgSelect').onchange=e=>{state.orgId=e.target.value;selectAvailable();render()};$('leagueSelect').onchange=e=>{state.leagueId=e.target.value;selectAvailable();render()};$('seasonSelect').onchange=e=>{state.seasonId=e.target.value;render()};$('showArchived').onchange=e=>{state.archived=e.target.checked;selectAvailable();render()};$('reload').onclick=refresh;document.querySelectorAll('[data-tab],[data-goto]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab||b.dataset.goto;render()});document.querySelectorAll('[data-select-league]').forEach(b=>b.onclick=()=>{state.leagueId=b.dataset.selectLeague;state.seasonId='';selectAvailable();state.tab='seasons';render()});document.querySelectorAll('[data-select-season]').forEach(b=>b.onclick=()=>{state.seasonId=b.dataset.selectSeason;render()});document.querySelectorAll('[data-league-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_leagues',b.dataset.leagueStatus,b.dataset.target));document.querySelectorAll('[data-season-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_seasons',b.dataset.seasonStatus,b.dataset.target));if($('createLeague'))$('createLeague').onsubmit=createLeague;if($('createSeason'))$('createSeason').onsubmit=createSeason}
async function action(fn,success){if(state.busy)return;busy(true);try{await fn();await refresh();setAlert(success)}catch(e){setAlert(e.message||String(e),true)}finally{busy(false)}}
async function createLeague(e){e.preventDefault();const fd=new FormData(e.currentTarget);const name=String(fd.get('name')||'').trim();if(!name)return;await action(async()=>{const {data,error}=await db.from('lhq_leagues').insert({organization_id:state.orgId,name,status:'active'}).select('id').single();if(error)throw error;state.leagueId=data.id;state.seasonId='';state.tab='seasons'},'League created.')}
async function createSeason(e){e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim(),starts_on=f.get('starts_on')||null,ends_on=f.get('ends_on')||null;if(!name)return;if(starts_on&&ends_on&&ends_on<starts_on){setAlert('End date must be after the start date.',true);return}await action(async()=>{const {data,error}=await db.from('lhq_seasons').insert({organization_id:state.orgId,league_id:state.leagueId,name,status:'draft',starts_on,ends_on}).select('id').single();if(error)throw error;state.seasonId=data.id},'Draft season created.')}
async function changeStatus(table,id,target){if(!confirm(`Change this ${table==='lhq_leagues'?'league':'season'} to ${target}?`))return;await action(async()=>{const {error}=await db.from(table).update({status:target,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',state.orgId);if(error)throw error},`${table==='lhq_leagues'?'League':'Season'} updated.`)}
init();
</script></body></html>
