</style></head><body><header class="top"><div class="shell"><div class="brand"><span class="mark">♛</span>LEAGUE HQ<small>DIRECTOR + PLAYER HUB</small></div><div class="row"><span id="who" class="mini muted"></span><button id="logout" class="btn ghost hide">Sign out</button></div></div></header><main id="root" class="shell"><div class="card">Connecting…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
// Supabase browser publishable key: never include service-role or secret keys.
const PROJECT_URL='https://sfukoetvqhtyunyatvup.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_tAQnKyT7aRSeYIf68IfObQ_wOA7LHNB';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tab:'overview',orgs:[],membership:[],leagues:[],seasons:[],players:[],orgId:'',leagueId:'',seasonId:'',archived:false,busy:false,loading:false,error:'',message:'',user:null};
let db;
let publicMode=new URLSearchParams(location.search).get('view')==='player';
const publicState={catalog:[],feed:null,season:new URLSearchParams(location.search).get('season')||'',tab:'home',loading:false,error:''};
// Recovery links can use hash tokens or an authorization-code redirect.
const authHash = new URLSearchParams(location.hash.replace(/^#/,''));
const authSearch = new URLSearchParams(location.search);
let recoveryMode = authHash.get('type') === 'recovery' || authSearch.get('type') === 'recovery' || authSearch.get('lhq_action') === 'recover';
let recoveryVerified = false;
let recoveryError = authHash.get('error_description') || authSearch.get('error_description') || '';
const recoveryRedirect = () => location.origin + location.pathname + '?lhq_action=recover';
function cleanRecoveryUrl(){history.replaceState(null,'',location.pathname);}

const opts={auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}};
function setAlert(message,error=false){state.message=error?'':message;state.error=error?message:'';renderAlert();}
function renderAlert(){const el=$('alerts');if(el)el.innerHTML=(state.error?`<div class="note error" role="alert">${esc(state.error)}</div>`:state.message?`<div class="note success" role="status">${esc(state.message)}</div>`:'');}
function busy(on){state.busy=on;document.querySelectorAll('button[data-write]').forEach(x=>x.disabled=on)}
async function init(){
 if(!window.supabase?.createClient){$('root').innerHTML='<div class="note error">Could not load the Supabase client library. Check your internet connection or content-blocking settings.</div>';return}
 db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,opts);
 $('logout').addEventListener('click',async()=>{await db.auth.signOut();recoveryMode=false;recoveryVerified=false;cleanRecoveryUrl();state.user=null;reset();render()});
 db.auth.onAuthStateChange((event,session)=>{
   state.user=session?.user||null;updateHeader();
   if(event==='PASSWORD_RECOVERY'){
     recoveryMode=true;recoveryVerified=!!session?.user;
     // Defer DOM updates until the auth callback finishes.
     setTimeout(()=>renderPasswordRecovery(),0);
   }
 });
 const {data,error}=await db.auth.getSession();
 if(error){renderLogin(error.message);return}
 state.user=data.session?.user||null;updateHeader();
 if(recoveryMode){
   // An authenticated session is required before updateUser can change the password.
   recoveryVerified=!!data.session?.user;
   renderPasswordRecovery();return;
 }
 if(attendanceMode){await attendanceLoad();return}
 if(publicMode){await publicLoad();return}
 if(state.user)await refresh();else renderLogin();
}
function updateHeader(){$('who').textContent=state.user?.email||'';$('logout').classList.toggle('hide',!state.user)}
function reset(){state.orgs=[];state.membership=[];state.leagues=[];state.seasons=[];state.players=[];state.orgId='';state.leagueId='';state.seasonId='';state.error='';state.message='';state.tab='overview';updateHeader()}
function renderLogin(msg=''){$('root').innerHTML=`<div class="card login"><div class="eyebrow">Sovereign Sports · Development</div><h1>Director sign in</h1><p>Use the application user you created in the new League HQ Supabase project.</p><form id="loginForm"><label class="field"><span class="label">Email address</span><input id="email" type="email" autocomplete="username" required></label><label class="field"><span class="label">Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" id="loginBtn">Sign in</button></form><p style="margin-top:12px"><button class="btn ghost" id="forgotPassword" type="button">Forgot password?</button></p><div id="alerts" style="margin-top:14px"></div><div class="foot">Version 1.0 RC1 · Director Hub · Public Player Hub available separately</div></div>`;if(msg)setAlert(msg,true);$('forgotPassword').onclick=renderForgotPassword;$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){b.disabled=false;b.textContent='Sign in';setAlert(error.message,true);return}state.user=data.user;updateHeader();await refresh()}}
function renderForgotPassword(){
 $('root').innerHTML=`<div class="card login"><div class="eyebrow">League HQ · Account recovery</div><h1>Reset your password</h1><p>Enter the email for your League HQ Director Hub login. We’ll email a one-time recovery link.</p><form id="forgotForm"><label class="field"><span class="label">Email address</span><input id="recoveryEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><button class="btn primary" id="sendRecovery" type="submit">Send recovery email</button></form><p style="margin-top:12px"><button class="btn ghost" id="backToLogin" type="button">Back to sign in</button></p><div id="alerts" aria-live="polite"></div><div class="foot">If no email arrives, check spam and Supabase Auth email sending limits. Use the newest recovery email link.</div></div>`;
 $('backToLogin').onclick=()=>renderLogin();
 $('forgotForm').onsubmit=async e=>{
   e.preventDefault();const button=$('sendRecovery');button.disabled=true;button.textContent='Sending…';
   try{
     const email=$('recoveryEmail').value.trim();
     const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:recoveryRedirect()});
     if(error)throw error;
     setAlert('If that address has a League HQ account, a recovery email will be sent. Open the newest link to set your new password.');
   }catch(err){setAlert('Could not send recovery email: '+(err.message||String(err)),true)}
   finally{button.disabled=false;button.textContent='Send recovery email'}
 };
}
function renderPasswordRecovery(){
 const canUpdate=recoveryVerified&&!!state.user;
 $('root').innerHTML=`<div class="card login"><div class="eyebrow">League HQ · Account recovery</div><h1>${canUpdate?'Choose a new password':'Verify recovery link'}</h1>${canUpdate?'<p>Your recovery link was accepted. Enter a new password for your League HQ application account.</p>':'<p>We could not establish a valid recovery session. The link may have expired or already been used. Request a fresh recovery email below.</p>'}${canUpdate?`<form id="newPasswordForm"><label class="field"><span class="label">New password (at least 8 characters)</span><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label><label class="field"><span class="label">Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label><button class="btn primary" id="saveNewPassword" type="submit">Update password</button></form>`:'<button class="btn primary" id="requestFreshLink" type="button">Request a new recovery link</button>'}<p style="margin-top:12px"><button class="btn ghost" id="returnToLogin" type="button">Back to sign in</button></p><div id="alerts" aria-live="polite"></div></div>`;
 $('returnToLogin').onclick=async()=>{recoveryMode=false;recoveryVerified=false;cleanRecoveryUrl();await db.auth.signOut();state.user=null;updateHeader();renderLogin()};
 if(!canUpdate){if($('requestFreshLink'))$('requestFreshLink').onclick=()=>{recoveryMode=false;cleanRecoveryUrl();renderForgotPassword()};if(recoveryError)setAlert(decodeURIComponent(recoveryError.replace(/\+/g,' ')),true);return}
 $('newPasswordForm').onsubmit=async e=>{
   e.preventDefault();const first=$('newPassword').value,second=$('confirmPassword').value;
   if(first!==second){setAlert('The passwords do not match.',true);return}
   if(first.length<8){setAlert('Use at least eight characters.',true);return}
   const button=$('saveNewPassword');button.disabled=true;button.textContent='Updating…';
   try{
     const {error}=await db.auth.updateUser({password:first});if(error)throw error;
     recoveryMode=false;recoveryVerified=false;recoveryError='';cleanRecoveryUrl();
     await db.auth.signOut();state.user=null;reset();renderLogin();
     setAlert('Password updated. Sign in with your new password.');
   }catch(err){setAlert('Password update failed: '+(err.message||String(err)),true);button.disabled=false;button.textContent='Update password'}
 };
}

async function query(table,cols='*'){const {data,error}=await db.from(table).select(cols);if(error)throw Error(`${table}: ${error.message}`);return data||[]}

function wireBase(){$('orgSelect').onchange=e=>{state.orgId=e.target.value;selectAvailable();render()};$('leagueSelect').onchange=e=>{state.leagueId=e.target.value;selectAvailable();render()};$('seasonSelect').onchange=e=>{state.seasonId=e.target.value;render()};$('showArchived').onchange=e=>{state.archived=e.target.checked;selectAvailable();render()};$('reload').onclick=refresh;document.querySelectorAll('[data-tab],[data-goto]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab||b.dataset.goto;render()});document.querySelectorAll('[data-select-league]').forEach(b=>b.onclick=()=>{state.leagueId=b.dataset.selectLeague;state.seasonId='';selectAvailable();state.tab='seasons';render()});document.querySelectorAll('[data-select-season]').forEach(b=>b.onclick=()=>{state.seasonId=b.dataset.selectSeason;render()});document.querySelectorAll('[data-league-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_leagues',b.dataset.leagueStatus,b.dataset.target));document.querySelectorAll('[data-season-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_seasons',b.dataset.seasonStatus,b.dataset.target));if($('createLeague'))$('createLeague').onsubmit=createLeague;if($('createSeason'))$('createSeason').onsubmit=createSeason}

async function createLeague(e){e.preventDefault();const fd=new FormData(e.currentTarget);const name=String(fd.get('name')||'').trim();if(!name)return;await action(async()=>{const {data,error}=await db.from('lhq_leagues').insert({organization_id:state.orgId,name,status:'active'}).select('id').single();if(error)throw error;state.leagueId=data.id;state.seasonId='';state.tab='seasons'},'League created.')}
async function createSeason(e){e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim(),starts_on=f.get('starts_on')||null,ends_on=f.get('ends_on')||null;if(!name)return;if(starts_on&&ends_on&&ends_on<starts_on){setAlert('End date must be after the start date.',true);return}await action(async()=>{const {data,error}=await db.from('lhq_seasons').insert({organization_id:state.orgId,league_id:state.leagueId,name,status:'draft',starts_on,ends_on}).select('id').single();if(error)throw error;state.seasonId=data.id},'Draft season created.')}

function assignmentWarnings(){const warnings=[];const mem=seasonRows('members'), gr=seasonRows('groups'), gm=seasonRows('groupMembers');for(const g of gr.filter(g=>g.preference==='required')){const ids=gm.filter(x=>x.group_id===g.id).map(x=>x.player_id), locations=[...new Set(ids.map(id=>mem.find(m=>m.player_id===id)?.team_id||''))];if(locations.filter(Boolean).length>1 || (locations.some(Boolean)&&locations.includes('')))warnings.push(g.label+' is split across teams / unassigned players.');}return warnings}
function teamsPage(){if(!ready())return emptySeason();const regs=regRows(),teams=seasonRows('teams'),members=seasonRows('members'),groups=seasonRows('groups'),gm=seasonRows('groupMembers'),unassigned=regs.filter(r=>!members.some(m=>m.player_id===r.player_id));const warnings=assignmentWarnings();return `<div class="workspace-head"><div class="eyebrow">DIRECTOR HUB</div><h1>Team Assignment</h1><p>Player and group placements remain 100% director-controlled.</p></div>${warnings.map(w=>`<div class="note error">Required group warning: ${esc(w)}</div>`).join('')}<div class="stats-mini"><div class="card"><div class="mini muted">Registered</div><div class="stat">${regs.length}</div></div><div class="card"><div class="mini muted">Teams</div><div class="stat">${teams.length}</div></div><div class="card"><div class="mini muted">Unassigned</div><div class="stat">${unassigned.length}</div></div></div><div class="split" style="margin-top:15px"><div class="card"><h2>Create team</h2><form id="addTeam"><label class="field"><span class="label">Team name</span><input name="name" required maxlength="160" placeholder="Team name"></label><label class="field"><span class="label">Registration model</span><select name="registration_type"><option value="individual">Director-assigned individuals</option><option value="team">Pre-registered team</option></select></label><button class="btn primary" data-write>Create team</button></form><div class="divider"></div><h2>Assign or move a player</h2><form id="assignPlayer"><label class="field"><span class="label">Player</span><select name="player_id">${optionRows(regs,x=>x.player_id,x=>playerName(x.player_id))}</select></label><label class="field"><span class="label">Destination</span><select name="team_id"><option value="">Unassigned</option>${optionRows(teams,x=>x.id,x=>x.name)}</select></label><button class="btn primary" data-write ${!regs.length?'disabled':''}>Save assignment</button></form><div class="note">Required groups generate warnings when split, but the director decides placements. No automatic balancing or team movement.</div></div><div class="card"><h2>Current teams</h2><div class="stack">${teamCards()}</div></div></div><div class="split" style="margin-top:15px"><div class="card"><h2>Assignment groups</h2><p class="mini">Required = keep together; preferred = requested, but flexible. Groups only apply to this season.</p><form id="createGroup"><label class="field"><span class="label">Group label</span><input name="label" maxlength="160" placeholder="e.g. Morgan household" required></label><label class="field"><span class="label">Preference</span><select name="preference"><option value="required">Required</option><option value="preferred">Preferred</option></select></label><button class="btn primary" data-write>Create group</button></form><div class="divider"></div><h3>Add player to a group</h3><form id="groupMember"><label class="field"><span class="label">Group</span><select name="group_id">${optionRows(groups,x=>x.id,x=>x.label)}</select></label><label class="field"><span class="label">Player</span><select name="player_id">${optionRows(regs,x=>x.player_id,x=>playerName(x.player_id))}</select></label><button class="btn primary" data-write ${!groups.length||!regs.length?'disabled':''}>Add to group</button></form></div><div class="card"><h2>Season groups</h2><div class="stack">${groups.map(g=>`<div class="item"><div class="row between"><strong>${esc(g.label)}</strong><span class="badge">${esc(g.preference)}</span></div><div class="mini">${gm.filter(x=>x.group_id===g.id).map(x=>esc(playerName(x.player_id))).join(' · ')||'No members yet'}</div><div class="actions"><button class="btn danger" data-remove-group="${esc(g.id)}">Delete group</button></div></div>`).join('')||'<div class="empty">No groups yet</div>'}</div></div></div><div class="card" style="margin-top:15px"><h2>Unassigned players</h2><p>${unassigned.map(r=>esc(playerName(r.player_id))).join(' · ')||'All registered players are assigned.'}</p></div>`}

function standingsRows(){const teams=seasonRows('teams');const rows=teams.map(t=>({id:t.id,name:t.name,played:0,wins:0,losses:0,points:0}));for(const m of matchRows('regular').filter(m=>m.status==='completed')){const a=rows.find(x=>x.id===m.home_team_id),b=rows.find(x=>x.id===m.away_team_id);if(!a||!b)continue;a.played++;b.played++;const w=Number(m.home_score)>Number(m.away_score)?a:b;const l=w===a?b:a;w.wins++;w.points++;l.losses++}rows.sort((a,b)=>b.points-a.points||b.wins-a.wins||a.losses-b.losses||a.name.localeCompare(b.name));return rows}

function newsPage(){if(!ready())return emptySeason();const rows=seasonRows('news').sort((a,b)=>b.created_at.localeCompare(a.created_at));return `<div class="workspace-head"><div class="eyebrow">COMMUNITY UPDATES</div><h1>News & Updates</h1><p>Write and publish season announcements. Player-facing public feed will be enabled only after a separate security review.</p></div><div class="split"><div class="card"><h2>New announcement</h2><form id="addNews"><label class="field"><span class="label">Headline</span><input name="title" maxlength="160" required></label><label class="field"><span class="label">Message</span><textarea name="body" rows="6" maxlength="10000" style="width:100%;padding:12px;border:1px solid #cbd5e3;border-radius:12px;font:inherit" required></textarea></label><label class="field"><span class="label">Status</span><select name="status"><option value="draft">Save draft</option><option value="published">Publish to director feed</option></select></label><button class="btn primary" data-write>Save announcement</button></form></div><div class="card"><h2>Season announcements (${rows.length})</h2><div class="stack">${rows.map(n=>`<div class="item"><div class="row between"><strong>${esc(n.title)}</strong>${statusBadge(n.status)}</div><p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(n.body)}</p><div class="actions"><button class="btn" data-news-toggle="${esc(n.id)}" data-news-status="${n.status==='published'?'draft':'published'}">${n.status==='published'?'Move to draft':'Publish'}</button><button class="btn danger" data-news-remove="${esc(n.id)}">Delete</button></div></div>`).join('')||'<div class="empty">No updates yet</div>'}</div></div></div>`}

const competition = {settings:[],brackets:[]};
const compDefault = () => ({scoring_mode:'wins',win_points:1,loss_points:0});
function compSettings(){return competition.settings.find(x=>x.season_id===state.seasonId&&x.organization_id===state.orgId)||compDefault()}
function compBracket(){return competition.brackets.find(x=>x.season_id===state.seasonId&&x.organization_id===state.orgId)||null}
function safeInt(x,min=0,max=10000){const n=Number(x);return Number.isSafeInteger(n)&&n>=min&&n<=max?n:null}
function checkedSets(raw){if(!Array.isArray(raw))return [];const out=[];for(const pair of raw){if(!Array.isArray(pair)||pair.length!==2)return [];const a=safeInt(pair[0],0,999),b=safeInt(pair[1],0,999);if(a===null||b===null||a===b)return [];out.push([a,b])}return out}
function matchStats(m){const sets=checkedSets(m.sets),a=sets.filter(s=>s[0]>s[1]).length,b=sets.filter(s=>s[1]>s[0]).length;return {sets,a,b,rallyA:sets.reduce((x,s)=>x+s[0],0),rallyB:sets.reduce((x,s)=>x+s[1],0)}}
function compStandings(){const cfg=compSettings(),teams=seasonRows('teams');const rows=teams.map(t=>({id:t.id,name:t.name,played:0,wins:0,losses:0,setsWon:0,setsLost:0,rally:0,rallyAgainst:0,points:0,missing:0}));for(const m of matchRows('regular').filter(m=>m.status==='completed')){const home=rows.find(x=>x.id===m.home_team_id),away=rows.find(x=>x.id===m.away_team_id);if(!home||!away)continue;home.played++;away.played++;const hWin=Number(m.home_score)>Number(m.away_score),winner=hWin?home:away,loser=hWin?away:home;winner.wins++;loser.losses++;const st=matchStats(m);if(st.sets.length){home.setsWon+=st.a;home.setsLost+=st.b;away.setsWon+=st.b;away.setsLost+=st.a;home.rally+=st.rallyA;home.rallyAgainst+=st.rallyB;away.rally+=st.rallyB;away.rallyAgainst+=st.rallyA}else{home.setsWon+=Number(m.home_score)||0;home.setsLost+=Number(m.away_score)||0;away.setsWon+=Number(m.away_score)||0;away.setsLost+=Number(m.home_score)||0}
if(cfg.scoring_mode==='wins'){winner.points+=Number(cfg.win_points);loser.points+=Number(cfg.loss_points)}
else if(cfg.scoring_mode==='sets'){home.points+=st.sets.length?st.a:Number(m.home_score)||0;away.points+=st.sets.length?st.b:Number(m.away_score)||0}
else if(cfg.scoring_mode==='rally'){if(st.sets.length){home.points+=st.rallyA;away.points+=st.rallyB}else{home.missing++;away.missing++}}
else {if(m.awarded_home!==null&&m.awarded_home!==undefined&&m.awarded_away!==null&&m.awarded_away!==undefined){home.points+=Number(m.awarded_home);away.points+=Number(m.awarded_away)}else{home.missing++;away.missing++}}
}rows.sort((a,b)=>b.points-a.points||b.wins-a.wins||(b.setsWon-b.setsLost)-(a.setsWon-a.setsLost)||(b.rally-b.rallyAgainst)-(a.rally-a.rallyAgainst)||a.name.localeCompare(b.name));return rows}
function compModeName(s){return ({wins:'Match wins',sets:'Sets won',rally:'Total rally points',manual:'Director-awarded points'})[s]||s}
function compStandingsTable(){const rows=compStandings(),cfg=compSettings();return `<div class="tablewrap"><table><thead><tr><th>Seed</th><th>Team</th><th>W-L</th><th>Sets</th><th>${esc(compModeName(cfg.scoring_mode))}</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.wins}–${r.losses}</td><td>${r.setsWon}–${r.setsLost}</td><td><strong>${r.points}</strong>${r.missing?' <small title="Incomplete points data">⚠ '+r.missing+' incomplete</small>':''}</td></tr>`).join('')}</tbody></table></div>`}
function compSettingsForm(){const c=compSettings();return `<div class="card"><h2>Season scoring rules</h2><p class="mini">Standings update from completed regular-season matches. Settings are independent for every season.</p><form id="compSettingsForm"><label class="field"><span class="label">Standings method</span><select name="scoring_mode">${[['wins','Match wins (configurable points)'],['sets','Sets won'],['rally','Total rally points'],['manual','Director-awarded points per match']].map(x=>`<option value="${x[0]}" ${c.scoring_mode===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label><div class="split"><label class="field"><span class="label">Points per win (wins method)</span><input type="number" min="0" max="100" name="win_points" value="${c.win_points}" required></label><label class="field"><span class="label">Points per loss</span><input type="number" min="0" max="100" name="loss_points" value="${c.loss_points}" required></label></div><button class="btn primary" data-write>Save scoring rules</button></form></div>`}
function compScoreModal(id){const m=model.matches.find(x=>x.id===id);if(!m)return;const st=checkedSets(m.sets),cfg=compSettings();const content=`<div class="modalcover" id="compModalCover"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="scoreTitle"><div class="row between"><h2 id="scoreTitle">Match result</h2><button type="button" class="btn ghost" id="compClose">Close</button></div><p>${esc(teamName(m.home_team_id))} vs ${esc(teamName(m.away_team_id))}</p><p class="mini">Enter points for each completed set (best of 3 or best of 5). No tied sets. The set winner determines the match winner.</p><form id="compScoreForm"><div class="split"><strong>Home</strong><strong>Away</strong></div>${Array.from({length:5},(_,i)=>`<div class="split"><label class="field"><span class="label">Set ${i+1} · Home</span><input type="number" min="0" max="999" name="h${i}" value="${st[i]?.[0]??''}" placeholder="—"></label><label class="field"><span class="label">Set ${i+1} · Away</span><input type="number" min="0" max="999" name="a${i}" value="${st[i]?.[1]??''}" placeholder="—"></label></div>`).join('')}<label class="field"><span class="label">Match format</span><select name="bestof"><option value="3" ${st.length<=3?'selected':''}>Best of 3</option><option value="5" ${st.length>3?'selected':''}>Best of 5</option></select></label>${cfg.scoring_mode==='manual'?`<div class="split"><label class="field"><span class="label">Standings points · Home</span><input type="number" name="awardHome" min="0" max="10000" value="${m.awarded_home??''}" required></label><label class="field"><span class="label">Standings points · Away</span><input type="number" name="awardAway" min="0" max="10000" value="${m.awarded_away??''}" required></label></div>`:''}<div class="actions"><button class="btn primary" type="submit">Save verified result</button><button class="btn ghost" type="button" id="compCancel">Cancel</button></div></form></div></div>`;document.body.insertAdjacentHTML('beforeend',content);const close=()=>document.getElementById('compModalCover')?.remove();document.getElementById('compClose').onclick=close;document.getElementById('compCancel').onclick=close;document.getElementById('compScoreForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),sets=[];let gap=false;for(let i=0;i<5;i++){const h=String(f.get('h'+i)||'').trim(),a=String(f.get('a'+i)||'').trim();if(!h&&!a){gap=true;continue}if(gap||h===''||a===''){setAlert('Fill both scores for each set, without gaps.',true);return}const x=safeInt(h,0,999),y=safeInt(a,0,999);if(x===null||y===null||x===y){alert('Each set needs different valid point totals.');return}sets.push([x,y])}const best=Number(f.get('bestof')),target=(best+1)/2,home=sets.filter(x=>x[0]>x[1]).length,away=sets.length-home;if(sets.length<target||sets.length>best||Math.max(home,away)!==target||Math.min(home,away)>=target||sets.slice(0,-1).some((_,i)=>{const subset=sets.slice(0,i+1);return subset.filter(x=>x[0]>x[1]).length>=target||subset.filter(x=>x[1]>x[0]).length>=target})){alert('The set sequence must end when a team wins '+target+' sets.');return}const updates={sets,home_score:home,away_score:away,status:'completed',updated_at:new Date().toISOString()};if(cfg.scoring_mode==='manual'&&m.stage==='regular'){const x=safeInt(f.get('awardHome'),0,10000),y=safeInt(f.get('awardAway'),0,10000);if(x===null||y===null){alert('Please enter awarded points for both teams.');return}updates.awarded_home=x;updates.awarded_away=y}if(!confirm('Save this match result?'))return;close();action(()=>updateRecord('lhq_matches',m.id,updates),'Set scores and result saved.')};}
function compSeedOrder(size){let order=[1,2];while(order.length<size){const next=order.length*2;order=order.flatMap(n=>[n,next+1-n])}return order}
function compMakeBracket(teamIds){const size=2**Math.ceil(Math.log2(teamIds.length)),seedSlots=compSeedOrder(size).map(n=>teamIds[n-1]||null),rounds=[];const roundCount=Math.log2(size);for(let r=0;r<roundCount;r++){const count=size/2**(r+1),games=[];for(let i=0;i<count;i++)games.push({id:`r${r+1}m${i+1}`,home:r===0?seedSlots[2*i]:null,away:r===0?seedSlots[2*i+1]:null,winner:null,sets:[]});rounds.push(games)}const bracket={schema:1,seeded:teamIds,rounds,champion:null};compAdvanceByes(bracket);return bracket}
function compAdvanceByes(b){for(let r=0;r<b.rounds.length-1;r++){for(let i=0;i<b.rounds[r].length;i++){const m=b.rounds[r][i];if(!m.winner&&r===0&&Boolean(m.home)!==Boolean(m.away))m.winner=m.home||m.away;if(m.winner){const dest=b.rounds[r+1][Math.floor(i/2)],side=i%2?'away':'home';if(!dest[side])dest[side]=m.winner}}}return b}

function subParseCsv(raw){const lines=outreachCsv(raw);if(lines.length<2)throw Error('CSV requires a header and at least one player.');const keys=lines[0].map(v=>v.trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''));const index=k=>keys.findIndex(x=>({submission_id:['submission_id','submission','id','unique_id'],name:['name','full_name','player_name','display_name'],email:['email','email_address','e_mail'],availability_notes:['availability_notes','availability','days_available'],source:['source']}[k]).includes(x));const ix=Object.fromEntries(['submission_id','name','email','availability_notes','source'].map(k=>[k,index(k)]));if(ix.submission_id<0||ix.name<0)throw Error('CSV must have submission_id and name columns.');if(lines.length>101)throw Error('Use no more than 100 rows per batch.');const seen=new Set();return lines.slice(1).map((a,i)=>{const get=k=>ix[k]<0?'':String(a[ix[k]]||'').trim();const submission_id=get('submission_id'),name=get('name'),email=get('email').toLowerCase(),availability_notes=get('availability_notes');if(!submission_id||!name||name.length>160||submission_id.length>160||availability_notes.length>500||email.length>254||email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw Error('Invalid registration on row '+(i+2));if(seen.has(submission_id))throw Error('Repeated submission ID '+submission_id);seen.add(submission_id);return {submission_id,name,email,availability_notes,source:get('source')==='jotform_export'?'jotform_export':'csv'}})}

ity]').forEach(el=>el.onchange=()=>{const id=el.dataset.subAvailability,day=subs.displayDate||subDate(),previous=subAvailability(id,day),value=el.value;action(async()=>{if(value==='unknown'){if(previous)await deleteRecord('lhq_sub_availability',previous.id)}else if(previous)await updateRecord('lhq_sub_availability',previous.id,{status:value});else await saveRecord('lhq_sub_availability',{organization_id:state.orgId,league_id:state.leagueId,substitute_id:id,play_date:day,status:value})},'Availability updated.')});const callup=$('subCallup');if(callup)callup.onsubmit=e=>{e.preventDefault();const f=new FormData(callup),subId=f.get('substitute_id'),teamId=f.get('team_id'),day=subs.displayDate||subDate();const selected=subPool().find(x=>x.id===subId);if(!selected||selected.status!=='active'||subAvailability(subId,day)?.status==='unavailable'){setAlert('Substitute is inactive or unavailable on this date.',true);return}if(!teamId)return;action(()=>saveRecord('lhq_sub_callups',{organization_id:state.orgId,league_id:state.leagueId,season_id:state.seasonId,substitute_id:subId,team_id:teamId,play_date:day,notes:String(f.get('notes')||'')}),'Call-up created; no text sent.')};document.querySelectorAll('[data-sub-callup]').forEach(el=>el.onchange=()=>{const record=subCallups().find(x=>x.id===el.dataset.subCallup);if(!record)return;const next=el.value;if(next==='played'&&!confirm('Confirm this substitute actually played for the selected team on this date?')){render();return}action(()=>updateRecord('lhq_sub_callups',record.id,{status:next,updated_at:new Date().toISOString()}),'Call-up status updated.')});for(const id of ['orgSelect','leagueSelect']){const el=$(id);if(el){const previous=el.onchange;el.onchange=e=>{subClear();subs.displayDate='';if(previous)previous(e)}}}};

// League HQ v1.2 Phase B — Weekly Director Checklist + Season Templates
// Checklist is derived from existing records; no new task state or notifications.
const phaseB={templates:[]};
function phaseBTemplates(){return phaseB.templates.filter(t=>t.organization_id===state.orgId&&t.league_id===state.leagueId).sort((a,b)=>a.name.localeCompare(b.name))}
function phaseBTasks(){
 if(!state.seasonId)return [];
 const pending=outreachReqs().filter(r=>r.status==='pending');
 const registered=regRows();
 const assigned=new Set(seasonRows('members').map(x=>x.player_id));
 const unassigned=registered.filter(r=>!assigned.has(r.player_id));
 const upcoming=attUpcoming();
 const missing=upcoming.flatMap(s=>attAbsences(s.id).map(a=>({a,s})));
 const requested=subCallups().filter(c=>c.status==='requested');
 const today=attToday();
 const incomplete=matchRows('regular').filter(m=>m.status!=='completed'&&m.match_date<today);
 const withoutDates=registered.length&&!attRows('sessions').some(s=>s.session_date>=today);
 const tasks=[];
 if(missing.length)tasks.push({name:`${missing.length} absence report${missing.length===1?'':'s'} to review`,detail:`Across ${new Set(missing.map(x=>x.s.id)).size} upcoming play date(s); decide whether substitutes are needed`,goto:'attendance',weight:1});
 if(requested.length)tasks.push({name:`${requested.length} substitute call-up${requested.length===1?'':'s'} awaiting response`,detail:'Contact and confirm manually; no message has been sent by League HQ',goto:'subpool',weight:1});
 if(pending.length)tasks.push({name:`${pending.length} registration request${pending.length===1?'':'s'} awaiting review`,detail:'Review teammate requests and individual/team registrations',goto:'registration',weight:2});
 if(unassigned.length)tasks.push({name:`${unassigned.length} registered player${unassigned.length===1?'':'s'} without a team`,detail:'Director makes the assignments; no automatic balancing',goto:'teams',weight:2});
 if(incomplete.length)tasks.push({name:`${incomplete.length} past match${incomplete.length===1?'':'es'} without a completed result`,detail:'Review results; do not infer winners from schedules',goto:'games',weight:2});
 if(withoutDates)tasks.push({name:'No upcoming attendance dates',detail:'Add league play dates or import them from the schedule',goto:'attendance',weight:3});
 return tasks.sort((a,b)=>a.weight-b.weight);
}

 const registered=new Set(regRows().filter(r=>r.registration_status==='registered').map(r=>r.player_id));

const commPrevWire=wireBase;
wireBase=function(){commPrevWire();const audience=$('commAudience'),target=$('commTarget'),wrap=$('commTargetWrap');if(audience){const sync=()=>{const kind=audience.value;const items=commTargets(kind);wrap.style.display=kind==='team'||kind==='individual'?'block':'none';target.innerHTML=optionRows(items,x=>x.id,x=>x.name);};audience.onchange=sync;sync()}

// League HQ v1.4 Phase D — installable Player Hub and on-device preferences.
// Push delivery is OFF unless explicitly configured and enabled by an operator. No player identity is inferred.
// Configure these two PUBLIC values only after deploying and testing M11 and Edge Functions.
const LHQ_PUSH_VAPID_PUBLIC_KEY='';
const LHQ_PUSH_TURNSTILE_SITE_KEY='';
let lhqInstallPrompt=null;
let lhqPwaHelp='';
function lhqPwaScope(){return './'}
function lhqPwaStorageKey(){
 const id=publicState.season||'unselected';
 return 'lhq-pwa-pref-v1:'+id;
}
function lhqPwaRead(){
 const fallback={games:false,news:false,championship:false};
 try {const value=JSON.parse(localStorage.getItem(lhqPwaStorageKey())||'null');
  if(!value||typeof value!=='object')return fallback;
  return Object.fromEntries(Object.keys(fallback).map(k=>[k,value[k]===true]));
 }catch{return fallback}
}
function lhqPwaWrite(obj){
 const next={games:obj.games===true,news:obj.news===true,championship:obj.championship===true};
 try{localStorage.setItem(lhqPwaStorageKey(),JSON.stringify(next));return true}catch{return false}
}
function lhqIsInstalled(){return window.matchMedia?.('(display-mode: standalone)').matches || navigator.standalone===true}
function lhqPwaInstallInstructions(){
 if(lhqIsInstalled())return 'League HQ is running as an installed app on this device.';
 if(/iPad|iPhone|iPod/.test(navigator.userAgent))return 'On iPhone or iPad: open this Player Hub in Safari, tap Share, then Add to Home Screen.';
 return 'In Chrome or Edge, use the browser menu and choose Install app or Add to Home screen if offered.';
}
function lhqPwaNotice(){
 const settings=lhqPwaRead(),feed=publicState.feed;
 if(!settings.games||!feed)return '';
 const today=new Date();const base=new Date(today.getFullYear(),today.getMonth(),today.getDate());
 const future=(feed.matches||[]).filter(m=>m.stage==='regular'&&m.status==='scheduled'&&/^\d{4}-\d{2}-\d{2}$/.test(m.date||''))
  .map(m=>({m,days:Math.round((new Date(m.date+'T12:00:00').getTime() - new Date(base.getFullYear(),base.getMonth(),base.getDate(),12).getTime())/86400000)}))
  .filter(x=>x.days>=0&&x.days<=2).sort((a,b)=>a.days-b.days);
 if(!future.length)return '';
 const first=future[0];return `<div class="pwa-notice" role="status"><strong>Upcoming league play:</strong> ${esc(publicDate(first.m.date))}${first.m.time?' · '+esc(publicTime(first.m.time)):''}. Open Schedule for details. <span class="mini">This is an in-app reminder when you open the Player Hub, not a push notification.</span></div>`;
}
function pwaPreferencesHTML(){
 const v=lhqPwaRead();
 return `<div class="card"><h2>Install League HQ</h2><p>Keep schedules, standings, championships and league news handy on your home screen.</p>
 <div class="pwa-actions"><button class="btn primary" id="lhqInstallApp" type="button" ${lhqIsInstalled()?'disabled':''}>${lhqIsInstalled()?'Installed':'Install Player Hub'}</button></div>
 <p class="mini" id="lhqInstallHelp">${esc(lhqPwaHelp||lhqPwaInstallInstructions())}</p></div>
 <div class="card"><h2>Reminder preferences</h2><p class="mini">Stored on this device for the selected season. These are saved on this device. To receive push, opt in explicitly after the service is configured. Changing preferences after enrollment requires re-enabling push.</p>
 <div class="pwa-options"><label><input id="lhqPrefGames" type="checkbox" ${v.games?'checked':''}>Show upcoming game reminders when I open the Player Hub</label>
 <label><input id="lhqPrefNews" type="checkbox" ${v.news?'checked':''}>Interested in league announcements</label>
 <label><input id="lhqPrefChamp" type="checkbox" ${v.championship?'checked':''}>Interested in championship updates</label></div>
 <div class="pwa-actions"><button class="btn primary" type="button" id="lhqSavePrefs">Save preferences</button></div>
 <p class="mini" id="lhqPrefStatus">Preferences are saved on this device. Push delivery is not enabled until the secure backend is configured.</p>
 <div class="pwa-actions"><button type="button" id="lhqPushEnable" class="btn primary" ${LHQ_PUSH_VAPID_PUBLIC_KEY&&LHQ_PUSH_TURNSTILE_SITE_KEY?'':'disabled'}>Enable device push</button><button type="button" id="lhqPushDisable" class="btn ghost" ${LHQ_PUSH_VAPID_PUBLIC_KEY?'':'disabled'}>Disable device push</button></div>
 <p class="mini" id="lhqPushStatus">${LHQ_PUSH_VAPID_PUBLIC_KEY&&LHQ_PUSH_TURNSTILE_SITE_KEY?'Push is optional. Enabling it requires notification permission and human verification.':'Push delivery is not configured. On-open reminders still work.'}</p>
 <div id="lhqTurnstileSlot"></div></div>`;
}
function pwaWirePublic(){
 if(!publicMode)return;
 if(publicState.tab==='home'){
  const hero=document.querySelector('.public-hero');if(hero&&!document.getElementById('lhqPwaNotice')){
   const html=lhqPwaNotice();if(html)hero.insertAdjacentHTML('afterend',`<div id="lhqPwaNotice">${html}</div>`);
  }
 }
 const install=document.getElementById('lhqInstallApp');if(install)install.onclick=async()=>{
  if(lhqInstallPrompt){const evt=lhqInstallPrompt;lhqInstallPrompt=null;try{await evt.prompt();await evt.userChoice;}catch{}
  }else lhqPwaHelp=lhqPwaInstallInstructions();
  renderPublic();
 };
 const enable=document.getElementById('lhqPushEnable');if(enable)enable.onclick=()=>lhqPushEnable();
 const disable=document.getElementById('lhqPushDisable');if(disable)disable.onclick=()=>lhqPushDisable();
 const save=document.getElementById('lhqSavePrefs');if(save)save.onclick=()=>{
  const ok=lhqPwaWrite({games:document.getElementById('lhqPrefGames')?.checked,news:document.getElementById('lhqPrefNews')?.checked,championship:document.getElementById('lhqPrefChamp')?.checked});
  const el=document.getElementById('lhqPrefStatus');if(el)el.textContent=ok?'Preferences saved on this device. If push was previously enabled, enable it again to update its topics.':'This browser blocked local preference storage; nothing was saved.';
 };
}
// Phase D2: optional secure push; fail-closed until operator enables public VAPID/Turnstile keys.
function lhqPushMessage(msg){const el=$('lhqPushStatus');if(el)el.textContent=msg}
function lhqDecodeVapid(s){const b=(s+'==='.slice((s.length+3)%4)).replace(/-/g,'+').replace(/_/g,'/');const raw=atob(b);return Uint8Array.from(raw,c=>c.charCodeAt(0))}
function lhqPushPayload(sub,action,challenge=''){
 const json=sub.toJSON(),keys=json.keys||{};
 return {season_id:publicState.season,action,endpoint:json.endpoint,p256dh:keys.p256dh,auth:keys.auth,
         preferences:lhqPwaRead(),turnstile_token:challenge};
}
async function lhqPushRequest(body){
 const r=await fetch(PROJECT_URL+'/functions/v1/lhq-push-subscribe',{method:'POST',headers:{'content-type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify(body)});
 const x=await r.json().catch(()=>({message:'Unexpected push service response'}));if(!r.ok)throw Error(x.message||'Push request failed');return x;
}
function lhqLoadTurnstile(){return new Promise((resolve,reject)=>{
 if(window.turnstile)return resolve(window.turnstile);
 const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;
 s.onload=()=>window.turnstile?resolve(window.turnstile):reject(Error('Verification failed to load'));
 s.onerror=()=>reject(Error('Verification is unavailable'));document.head.appendChild(s);
})}
async function lhqPushEnable(){
 const id=publicState.season;
 if(!LHQ_PUSH_VAPID_PUBLIC_KEY||!LHQ_PUSH_TURNSTILE_SITE_KEY||!id||!publicState.feed)return lhqPushMessage('Secure push enrollment is not configured for this season.');
 if(!('PushManager' in window)||!('serviceWorker' in navigator)||!('Notification' in window))return lhqPushMessage('Push notifications are not supported on this device.');
 if(location.protocol!=='https:')return lhqPushMessage('HTTPS is required.');
 try{
  // Only explicitly requested by a user click; never request permission on page load.
  const permission=await Notification.requestPermission();if(permission!=='granted')return lhqPushMessage('Notification permission was not granted.');
  const sw=await navigator.serviceWorker.ready;
  const sub=await sw.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:lhqDecodeVapid(LHQ_PUSH_VAPID_PUBLIC_KEY)});
  const turnstile=await lhqLoadTurnstile();const slot=$('lhqTurnstileSlot');if(!slot)return;
  slot.textContent='';
  turnstile.render(slot,{sitekey:LHQ_PUSH_TURNSTILE_SITE_KEY,callback:async token=>{
   try{await lhqPushRequest(lhqPushPayload(sub,'subscribe',token));lhqPushMessage('Push enabled for this published season on this device.')}catch(err){lhqPushMessage(err.message||'Push enrollment failed.');}
   finally{turnstile.reset(slot);}
  },'error-callback':()=>lhqPushMessage('Verification failed; try again.')});
  lhqPushMessage('Complete the verification to enable push notifications.');
 }catch(err){lhqPushMessage(err.message||'Push setup failed.');}
}
async function lhqPushDisable(){
 if(!publicState.season)return lhqPushMessage('Select a season first.');
 try{
  const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
  if(!sub)return lhqPushMessage('No push subscription exists on this device.');
  await lhqPushRequest(lhqPushPayload(sub,'unsubscribe'));
  // Leave underlying browser subscription intact in case it is used for another season;
  // revoke only this season's subscription on the backend.
  lhqPushMessage('Push disabled for this season.');
 }catch(err){lhqPushMessage(err.message||'Unable to disable push.');}
}

// Phase D2 — Director-only, fixed-template push broadcasts. Entirely optional.
// Authorization is checked independently inside lhq-push-send on every request.
function lhqPushDirectorPanel(){
 if(!state.seasonId)return '';
 const ready=Boolean(LHQ_PUSH_VAPID_PUBLIC_KEY&&LHQ_PUSH_TURNSTILE_SITE_KEY);
 return `<div class="card" id="lhqPushDirectorPanel" style="margin-top:16px"><h2>Player Hub push notices (optional)</h2>
 <p class="mini">Players must opt in on an installed, supported device. Send only when an update matters; routine weekly texts are intentionally not part of this system. No notices are sent automatically.</p>
 <label class="field"><span class="label">Notice type</span><select id="lhqPushTopic"><option value="games">Upcoming games</option><option value="news">News &amp; updates</option><option value="championship">Championship update</option></select></label>
 <div class="actions"><button class="btn primary" id="lhqPushSend" type="button" ${ready?'':'disabled'}>Send to opted-in devices</button></div>
 <p class="mini" id="lhqPushDirectorStatus">${ready?'Sends a standard, non-personal notification to consenting devices of the selected published season. Limit: one notice per topic per day.':'Not configured. Set public keys in index.html and deploy the private Edge Functions before enabling.'}</p></div>`;
}
const lhqCommBeforePush=commPage;
commPage=function(){return lhqCommBeforePush()+lhqPushDirectorPanel()};
const lhqWireBeforePush=wireBase;
wireBase=function(){
 lhqWireBeforePush();
 const b=$('lhqPushSend');if(!b)return;
 b.onclick=async()=>{
  const season=selectedSeason();if(!season||!season.public_visible){$('lhqPushDirectorStatus').textContent='Publish this season before sending public Player Hub notifications.';return}
  const topic=$('lhqPushTopic')?.value;
  if(!['games','news','championship'].includes(topic))return;
  if(!confirm(`Send a ${topic} notification to opted-in Player Hub devices for ${season.name}? This may reach many players. Only one notification per topic per day is allowed.`))return;
  const status=$('lhqPushDirectorStatus');b.disabled=true;status.textContent='Sending notification request…';
  try{
   const {data,error}=await db.auth.getSession();if(error||!data.session?.access_token)throw Error('Sign in as a director first.');
   const resp=await fetch(PROJECT_URL+'/functions/v1/lhq-push-send',{
    method:'POST',headers:{'content-type':'application/json','apikey':PUBLISHABLE_KEY,'authorization':'Bearer '+data.session.access_token},
    body:JSON.stringify({season_id:season.id,topic})
   });
   const result=await resp.json().catch(()=>({message:'No response from notification service'}));
   if(!resp.ok)throw Error(result.message||'Push delivery failed');
   status.textContent=`Push attempts: ${result.attempted||0}; accepted by push services: ${result.delivered||0}; failed: ${result.failed||0}. This is not proof that devices displayed the notification.`;
  }catch(e){status.textContent=e.message||'Unable to send push';}finally{b.disabled=false}
 };
};

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();lhqInstallPrompt=e});
window.addEventListener('appinstalled',()=>{lhqInstallPrompt=null;lhqPwaHelp='League HQ installed.';if(publicMode&&publicState.tab==='preferences')renderPublic()});
// Cache only local app-shell assets. Supabase responses and player records are never cached.
if('serviceWorker' in navigator && location.protocol==='https:'){
 window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:lhqPwaScope()}).catch(e=>{console.warn('League HQ install support unavailable:',e?.message||e)}));
}

init();
</script></body></html>
