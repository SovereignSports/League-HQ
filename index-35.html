<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#132a4b"><title>League HQ · Director Hub</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;--navy:#132a4b;--gold:#eebd42;--muted:#64758b;--bg:#f3f5f9;--line:#dfe5ee;--white:white;color:#1c304b;background:var(--bg)}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;padding:12px;border:1.5px solid #cbd5e3;background:#fff;border-radius:12px;min-height:45px;color:#172b45}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.shell{max-width:1100px;margin:auto;padding:20px 16px 75px}.top{background:#fff;border-bottom:1px solid var(--line)}.top .shell{display:flex;align-items:center;justify-content:space-between;padding-top:17px;padding-bottom:17px;gap:12px}.brand{font-size:22px;font-weight:900;letter-spacing:-.7px;color:var(--navy)}.brand .mark{display:inline-block;padding:5px 9px;border-radius:10px;background:var(--gold);margin-right:7px}.brand small{font-size:11px;font-weight:650;letter-spacing:1.2px;display:block;margin-left:43px;color:var(--muted)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(26px,4vw,37px);letter-spacing:-1px;color:var(--navy)}h2{font-size:20px;color:var(--navy)}p{line-height:1.5;color:var(--muted)}.btn{border:1px solid #d7e0ec;border-radius:12px;padding:11px 14px;min-height:43px;background:#eff3f8;color:var(--navy);font-weight:800}.btn.primary{background:var(--gold);border-color:#d9aa30}.btn.dark{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.ghost{background:#fff}.btn.danger{color:#962d2d;background:#fff1f0;border-color:#f3c3bf}.btn:focus-visible{outline:3px solid var(--gold)}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:19px;box-shadow:0 4px 15px #1529410a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.muted{color:var(--muted)}.mini{font-size:12px}.label{font-size:13px;font-weight:800;color:#42536c;display:block;margin-bottom:6px}.field{display:block;margin:0 0 14px}.stack{display:grid;gap:14px}.badge{display:inline-flex;border-radius:100px;background:#e9eff7;color:#344f72;padding:5px 10px;font-size:12px;font-weight:800}.badge.active{background:#e7f5ec;color:#236340}.badge.archived{background:#f2edf3;color:#785b80}.item{border:1px solid var(--line);border-radius:13px;padding:14px;background:white}.item.selected{border-color:#d6a12a;box-shadow:0 0 0 2px #eebd4250}.item strong{display:block;margin-bottom:4px}.note{background:#fff8df;border:1px solid #efd58d;padding:12px 14px;border-radius:13px;color:#65511d;font-size:13px;line-height:1.5}.error{background:#fff0ee;border-color:#efb5ad;color:#9c342d}.success{background:#eaf7ef;border-color:#a9d8b8;color:#235c38}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs .btn.current{background:var(--navy);color:white}.hero{background:linear-gradient(120deg,#132a4b,#2c4669);color:white;border-radius:22px;padding:24px;margin-bottom:18px}.hero h1,.hero p{color:white}.hero p{opacity:.8;margin-bottom:0}.stat{font-size:28px;font-weight:900;color:var(--navy)}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.hide{display:none!important}.login{max-width:440px;margin:45px auto}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}.toolbar>*{flex:1 1 200px}.toolbar button{flex:0 0 auto}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1.25px;font-weight:900;color:#b4862c;margin-bottom:6px}.foot{margin-top:28px;font-size:12px;color:#7b899b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.divider{border-top:1px solid var(--line);margin:15px 0}.empty{text-align:center;padding:28px 14px;color:var(--muted)}.loader{display:inline-block;width:14px;height:14px;border:2px solid #c4cbd4;border-top-color:#213a5e;border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:620px){.split{grid-template-columns:1fr}.top .shell{padding:14px}.brand{font-size:18px}.brand small{font-size:9px}.shell{padding-top:14px}.card{padding:15px}.toolbar>*{flex:1 1 100%}.toolbar button{flex:1}}
</style></head><body><header class="top"><div class="shell"><div class="brand"><span class="mark">♛</span>LEAGUE HQ<small>DIRECTOR + PLAYER HUB</small></div><div class="row"><span id="who" class="mini muted"></span><button id="logout" class="btn ghost hide">Sign out</button></div></div></header><main id="root" class="shell"><div class="card">Connecting…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
// Supabase browser publishable key: never include service-role or secret keys.
const PROJECT_URL='https://sfukoetvqhtyunyatvup.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_tAQnKyT7aRSeYIf68IfObQ_wOA7LHNB';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={tab:'overview',orgs:[],membership:[],leagues:[],seasons:[],players:[],orgId:'',leagueId:'',seasonId:'',archived:false,busy:false,loading:false,error:'',message:'',user:null};
let db;
const opts={auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}};
function setAlert(message,error=false){state.message=error?'':message;state.error=error?message:'';renderAlert();}
function renderAlert(){const el=$('alerts');if(el)el.innerHTML=(state.error?`<div class="note error" role="alert">${esc(state.error)}</div>`:state.message?`<div class="note success" role="status">${esc(state.message)}</div>`:'');}
function busy(on){state.busy=on;document.querySelectorAll('button[data-write]').forEach(x=>x.disabled=on)}
async function init(){if(!window.supabase?.createClient){$('root').innerHTML='<div class="note error">Could not load the Supabase client library. Check your internet connection or content-blocking settings.</div>';return}db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,opts);$('logout').addEventListener('click',async()=>{await db.auth.signOut();state.user=null;reset();render()});db.auth.onAuthStateChange((_event,session)=>{state.user=session?.user||null;updateHeader()});let {data,error}=await db.auth.getSession();if(error){renderLogin(error.message);return}state.user=data.session?.user||null;updateHeader();if(state.user)await refresh();else renderLogin()}
function updateHeader(){$('who').textContent=state.user?.email||'';$('logout').classList.toggle('hide',!state.user)}
function reset(){state.orgs=[];state.membership=[];state.leagues=[];state.seasons=[];state.players=[];state.orgId='';state.leagueId='';state.seasonId='';state.error='';state.message='';state.tab='overview';updateHeader()}
function renderLogin(msg=''){$('root').innerHTML=`<div class="card login"><div class="eyebrow">Sovereign Sports · Development</div><h1>Director sign in</h1><p>Use the application user you created in the new League HQ Supabase project.</p><form id="loginForm"><label class="field"><span class="label">Email address</span><input id="email" type="email" autocomplete="username" required></label><label class="field"><span class="label">Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn primary" type="submit" id="loginBtn">Sign in</button></form><div id="alerts" style="margin-top:14px"></div><div class="foot">Version 0.1 · Director foundation · Not a public player portal</div></div>`;if(msg)setAlert(msg,true);$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='Signing in…';const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){b.disabled=false;b.textContent='Sign in';setAlert(error.message,true);return}state.user=data.user;updateHeader();await refresh()}}
async function query(table,cols='*'){const {data,error}=await db.from(table).select(cols);if(error)throw Error(`${table}: ${error.message}`);return data||[]}
async function refresh(){state.loading=true;state.error='';render();try{const [members,orgs,leagues,seasons,players]=await Promise.all([query('lhq_organization_members','organization_id,user_id,role'),query('lhq_organizations','id,name'),query('lhq_leagues','id,organization_id,name,status,created_at'),query('lhq_seasons','id,organization_id,league_id,name,status,starts_on,ends_on,created_at'),query('lhq_players','id,organization_id,display_name')]);state.membership=members;state.orgs=orgs;state.leagues=leagues;state.seasons=seasons;state.players=players;let orgAllowed=orgs.some(o=>o.id===state.orgId);if(!orgAllowed)state.orgId=orgs[0]?.id||'';selectAvailable();}catch(e){state.error=e.message||String(e)}finally{state.loading=false;render()}}
function selectAvailable(){const ls=visibleLeagues();if(!ls.some(x=>x.id===state.leagueId))state.leagueId=ls[0]?.id||'';const ss=visibleSeasons();if(!ss.some(x=>x.id===state.seasonId))state.seasonId=ss[0]?.id||''}
const visibleLeagues=()=>state.leagues.filter(l=>l.organization_id===state.orgId&&(state.archived||l.status!=='archived')).sort((a,b)=>a.name.localeCompare(b.name));
const visibleSeasons=()=>state.seasons.filter(s=>s.organization_id===state.orgId&&s.league_id===state.leagueId&&(state.archived||s.status!=='archived')).sort((a,b)=>(b.starts_on||b.created_at).localeCompare(a.starts_on||a.created_at));
function selectedOrg(){return state.orgs.find(x=>x.id===state.orgId)}function selectedLeague(){return state.leagues.find(x=>x.id===state.leagueId)}function selectedSeason(){return state.seasons.find(x=>x.id===state.seasonId)}
function statusBadge(x){return `<span class="badge ${x==='archived'?'archived':x==='active'?'active':''}">${esc(x)}</span>`}
function render(){if(!state.user){renderLogin();return}if(state.loading){$('root').innerHTML='<div class="card"><span class="loader"></span> Loading your League HQ workspace…</div>';return}if(!state.orgs.length){$('root').innerHTML=`<div class="card"><h1>Organization access</h1><p>No organizations are visible to this signed-in account. Check the owner assignment in Supabase or the Row Level Security policies.</p><div id="alerts"></div><button class="btn" id="retry">Retry connection</button></div>`;$('retry').onclick=refresh;if(state.error)setAlert(state.error,true);return}
let tabs=[['overview','Overview'],['leagues','Leagues'],['seasons','Seasons'],['players','Players'],['playerhub','Player Hub']];$('root').innerHTML=`<div class="hero"><div class="eyebrow">Director Hub · Development build 0.1</div><h1>${esc(selectedOrg()?.name||'League HQ')}</h1><p>Manage multiple leagues and seasons in one place.</p></div><div class="card" style="margin-bottom:16px"><div class="split"><label class="field"><span class="label">Organization</span><select id="orgSelect">${state.orgs.map(x=>`<option value="${esc(x.id)}" ${x.id===state.orgId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><label class="field"><span class="label">League</span><select id="leagueSelect"><option value="">Choose league</option>${visibleLeagues().map(x=>`<option value="${esc(x.id)}" ${x.id===state.leagueId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><div class="row between"><label class="row mini"><input style="width:auto;min-height:auto" type="checkbox" id="showArchived" ${state.archived?'checked':''}> Show archived</label><button class="btn ghost" id="reload">↻ Refresh</button></div></div><nav class="tabs" aria-label="Director sections">${tabs.map(([id,title])=>`<button class="btn ${state.tab===id?'current':''}" data-tab="${id}">${title}</button>`).join('')}</nav><div id="alerts" style="margin-bottom:12px"></div><section id="content">${pageContent()}</section><div class="foot">League HQ 0.1 · Independent Supabase project · Director-only foundation · Changes save directly to League HQ staging data.</div>`;wireBase();renderAlert();if(state.error)setAlert(state.error,true)}
function pageContent(){if(state.tab==='leagues')return leaguesPage();if(state.tab==='seasons')return seasonsPage();if(state.tab==='players')return playersPage();if(state.tab==='playerhub')return '<div class="card"><h2>Player Hub · Planned</h2><p>The public Player Hub is deliberately not connected yet. Public standings, schedules and news will come after we create permission-safe publication views.</p><div class="note">Private player directory records remain director-only.</div></div>';return overviewPage()}
function overviewPage(){const leagues=visibleLeagues(),seasons=visibleSeasons(),players=state.players.filter(p=>p.organization_id===state.orgId);return `<div class="grid"><div class="card"><div class="muted mini">Leagues</div><div class="stat">${leagues.length}</div><p class="mini">Accessible under this organization</p></div><div class="card"><div class="muted mini">Seasons · current league</div><div class="stat">${seasons.length}</div><p class="mini">Including archived when selected</p></div><div class="card"><div class="muted mini">Player directory</div><div class="stat">${players.length}</div><p class="mini">Organization-level player profiles</p></div></div><div class="card" style="margin-top:16px"><h2>Current selection</h2><p><strong>League:</strong> ${esc(selectedLeague()?.name||'None selected')}<br><strong>Season:</strong> ${esc(selectedSeason()?.name||'None selected')}</p><div class="actions"><button class="btn primary" data-goto="leagues">Manage leagues</button><button class="btn" data-goto="seasons">Manage seasons</button></div></div><div class="note" style="margin-top:15px">No teams, scores, registration imports, or public profiles have been created in this build. Team assignments will be fully director-controlled.</div>`}
function leaguesPage(){return `<div class="split"><div class="card"><h2>Leagues</h2><p class="mini">Select a league for the rest of the app. Archived leagues remain restorable.</p><div class="stack">${visibleLeagues().map(l=>`<div class="item ${l.id===state.leagueId?'selected':''}"><div class="row between"><strong>${esc(l.name)}</strong>${statusBadge(l.status)}</div><div class="actions"><button class="btn" data-select-league="${esc(l.id)}">Select</button><button class="btn ${l.status==='archived'?'ghost':'danger'}" data-league-status="${esc(l.id)}" data-target="${l.status==='archived'?'active':'archived'}" data-write>${l.status==='archived'?'Restore':'Archive'}</button></div></div>`).join('')||'<div class="empty">No leagues yet. Create one below.</div>'}</div></div><div class="card"><h2>Add league</h2><p class="mini">Create another program under the selected organization.</p><form id="createLeague"><label class="field"><span class="label">League name</span><input name="name" maxlength="160" placeholder="e.g. Danville Volleyball" required></label><button class="btn primary" type="submit" data-write>Create league</button></form></div></div>`}
function seasonsPage(){if(!state.leagueId)return '<div class="card"><h2>Choose or create a league first</h2><p>Seasons always belong to a specific league.</p><button class="btn primary" data-goto="leagues">Manage leagues</button></div>';return `<div class="split"><div class="card"><h2>Seasons · ${esc(selectedLeague()?.name||'')}</h2><p class="mini">Choose a season. Completed seasons may be archived or restored.</p><div class="stack">${visibleSeasons().map(s=>`<div class="item ${s.id===state.seasonId?'selected':''}"><div class="row between"><strong>${esc(s.name)}</strong>${statusBadge(s.status)}</div><div class="mini muted">${esc(s.starts_on||'Date not set')} ${s.ends_on?'→ '+esc(s.ends_on):''}</div><div class="actions"><button class="btn" data-select-season="${esc(s.id)}">Select</button><button class="btn ${s.status==='archived'?'ghost':'danger'}" data-season-status="${esc(s.id)}" data-target="${s.status==='archived'?'draft':'archived'}" data-write>${s.status==='archived'?'Restore to draft':'Archive'}</button></div></div>`).join('')||'<div class="empty">No seasons for this league.</div>'}</div></div><div class="card"><h2>Create season</h2><form id="createSeason"><label class="field"><span class="label">Season name</span><input name="name" maxlength="160" placeholder="e.g. Spring 2027" required></label><label class="field"><span class="label">Starts on (optional)</span><input name="starts_on" type="date"></label><label class="field"><span class="label">Ends on (optional)</span><input name="ends_on" type="date"></label><button class="btn primary" type="submit" data-write>Create draft season</button></form><div class="divider"></div><p class="mini">Archive is reversible. Permanent deletion is intentionally unavailable in this first build.</p></div></div>`}
function playersPage(){const rows=state.players.filter(p=>p.organization_id===state.orgId).sort((a,b)=>a.display_name.localeCompare(b.display_name));return `<div class="card"><div class="row between"><h2>Player Directory</h2><span class="badge">Director-only</span></div><p>Persistent player profiles. Season participation, assignment groups, and Jotform imports are next-phase features.</p>${rows.length?`<div class="stack">${rows.map(p=>`<div class="item">${esc(p.display_name)}</div>`).join('')}</div>`:'<div class="empty">No players registered yet.</div>'}<div class="note" style="margin-top:14px">No automatic team-balancing algorithm will be added. Directors will assign players and groups manually.</div></div>`}
function wireBase(){$('orgSelect').onchange=e=>{state.orgId=e.target.value;selectAvailable();render()};$('leagueSelect').onchange=e=>{state.leagueId=e.target.value;selectAvailable();render()};$('showArchived').onchange=e=>{state.archived=e.target.checked;selectAvailable();render()};$('reload').onclick=refresh;document.querySelectorAll('[data-tab],[data-goto]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab||b.dataset.goto;render()});document.querySelectorAll('[data-select-league]').forEach(b=>b.onclick=()=>{state.leagueId=b.dataset.selectLeague;state.seasonId='';selectAvailable();state.tab='seasons';render()});document.querySelectorAll('[data-select-season]').forEach(b=>b.onclick=()=>{state.seasonId=b.dataset.selectSeason;render()});document.querySelectorAll('[data-league-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_leagues',b.dataset.leagueStatus,b.dataset.target));document.querySelectorAll('[data-season-status]').forEach(b=>b.onclick=()=>changeStatus('lhq_seasons',b.dataset.seasonStatus,b.dataset.target));if($('createLeague'))$('createLeague').onsubmit=createLeague;if($('createSeason'))$('createSeason').onsubmit=createSeason}
async function action(fn,success){if(state.busy)return;busy(true);try{await fn();await refresh();setAlert(success)}catch(e){setAlert(e.message||String(e),true)}finally{busy(false)}}
async function createLeague(e){e.preventDefault();const fd=new FormData(e.currentTarget);const name=String(fd.get('name')||'').trim();if(!name)return;await action(async()=>{const {data,error}=await db.from('lhq_leagues').insert({organization_id:state.orgId,name,status:'active'}).select('id').single();if(error)throw error;state.leagueId=data.id;state.seasonId='';state.tab='seasons'},'League created.')}
async function createSeason(e){e.preventDefault();const f=new FormData(e.currentTarget),name=String(f.get('name')||'').trim(),starts_on=f.get('starts_on')||null,ends_on=f.get('ends_on')||null;if(!name)return;if(starts_on&&ends_on&&ends_on<starts_on){setAlert('End date must be after the start date.',true);return}await action(async()=>{const {data,error}=await db.from('lhq_seasons').insert({organization_id:state.orgId,league_id:state.leagueId,name,status:'draft',starts_on,ends_on}).select('id').single();if(error)throw error;state.seasonId=data.id},'Draft season created.')}
async function changeStatus(table,id,target){if(!confirm(`Change this ${table==='lhq_leagues'?'league':'season'} to ${target}?`))return;await action(async()=>{const {error}=await db.from(table).update({status:target,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',state.orgId);if(error)throw error},`${table==='lhq_leagues'?'League':'Season'} updated.`)}
init();
</script></body></html>
