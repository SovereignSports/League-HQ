const competition = {settings:[],brackets:[]};
const compDefault = () => ({scoring_mode:'sets',win_points:1,loss_points:0});
function compSettings(){return competition.settings.find(x=>x.season_id===state.seasonId&&x.organization_id===state.orgId)||compDefault()}

function safeInt(x,min=0,max=10000){const n=Number(x);return Number.isSafeInteger(n)&&n>=min&&n<=max?n:null}
function checkedSets(raw){if(!Array.isArray(raw))return [];const out=[];for(const pair of raw){if(!Array.isArray(pair)||pair.length!==2)return [];const a=safeInt(pair[0],0,999),b=safeInt(pair[1],0,999);if(a===null||b===null||a===b)return [];out.push([a,b])}return out}
function matchStats(m){const sets=checkedSets(m.sets),a=sets.filter(s=>s[0]>s[1]).length,b=sets.filter(s=>s[1]>s[0]).length;return {sets,a,b,rallyA:sets.reduce((x,s)=>x+s[0],0),rallyB:sets.reduce((x,s)=>x+s[1],0)}}
// v1.7.6: only validated set scores contribute to league standings.
// Legacy home_score/away_score values are not reliable set wins by themselves.
function validatedMatchSets(m){
 if(!Array.isArray(m.sets)||m.sets.length===0)return null;
 if(!m.sets.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=999)&&Number(p[0])!==Number(p[1])))return null;
 const sets=m.sets.map(p=>[Number(p[0]),Number(p[1])]);
 const a=sets.filter(p=>p[0]>p[1]).length,b=sets.length-a;
 if(Number(m.home_score)!==a||Number(m.away_score)!==b)return null;
 const best=Number(m.best_of)||3;
 if(sets.length>best||(!m.play_all_sets&&Math.max(a,b)!==Math.ceil(best/2)))return null;
 if(m.play_all_sets&&sets.length!==best)return null;
 return {sets,a,b,rallyA:sets.reduce((n,p)=>n+p[0],0),rallyB:sets.reduce((n,p)=>n+p[1],0)};
}
function invalidCompletedMatches(){return matchRows('regular').filter(m=>m.status==='completed'&&m.counts_for_standings!==false&&!validatedMatchSets(m));}
function compStandings(){
 const cfg=compSettings(),teams=seasonRows('teams');
 const rows=teams.map(t=>({id:t.id,name:t.name,played:0,wins:0,losses:0,setsWon:0,setsLost:0,rally:0,rallyAgainst:0,points:0,missing:0}));
 for(const m of matchRows('regular').filter(m=>m.status==='completed'&&m.counts_for_standings!==false)){
  const home=rows.find(x=>x.id===m.home_team_id),away=rows.find(x=>x.id===m.away_team_id);
  if(!home||!away)continue;
  const st=validatedMatchSets(m);
  if(!st){home.missing++;away.missing++;continue;}
  home.played++;away.played++;
  const winner=st.a>st.b?home:away,loser=winner===home?away:home;
  winner.wins++;loser.losses++;
  home.setsWon+=st.a;home.setsLost+=st.b;away.setsWon+=st.b;away.setsLost+=st.a;
  home.rally+=st.rallyA;home.rallyAgainst+=st.rallyB;away.rally+=st.rallyB;away.rallyAgainst+=st.rallyA;
  if(cfg.scoring_mode==='wins'){winner.points+=Number(cfg.win_points)||0;loser.points+=Number(cfg.loss_points)||0}
  else if(cfg.scoring_mode==='sets'){home.points+=st.a;away.points+=st.b}
  else if(cfg.scoring_mode==='rally'){home.points+=st.rallyA;away.points+=st.rallyB}
  else if(m.awarded_home!==null&&m.awarded_home!==undefined&&m.awarded_away!==null&&m.awarded_away!==undefined&&Number.isFinite(Number(m.awarded_home))&&Number.isFinite(Number(m.awarded_away))){home.points+=Number(m.awarded_home);away.points+=Number(m.awarded_away)}
  else {home.missing++;away.missing++;}
 }
 rows.sort((a,b)=>b.points-a.points||b.wins-a.wins||(b.setsWon-b.setsLost)-(a.setsWon-a.setsLost)||(b.rally-b.rallyAgainst)-(a.rally-a.rallyAgainst)||a.name.localeCompare(b.name));return rows;
}

function compSeedOrder(size){let order=[1,2];while(order.length<size){const next=order.length*2;order=order.flatMap(n=>[n,next+1-n])}return order}

function compAdvanceByes(b){for(let r=0;r<b.rounds.length-1;r++){for(let i=0;i<b.rounds[r].length;i++){const m=b.rounds[r][i];if(!m.winner&&r===0&&Boolean(m.home)!==Boolean(m.away))m.winner=m.home||m.away;if(m.winner){const dest=b.rounds[r+1][Math.floor(i/2)],side=i%2?'away':'home';if(!dest[side])dest[side]=m.winner}}}return b}

function compScoreBracket(id){const record=compBracket(),b=structuredClone(record?.bracket||{});if(!record)return;let ri=-1,mi=-1;for(let r=0;r<b.rounds.length;r++){const index=b.rounds[r].findIndex(g=>g.id===id);if(index>=0){ri=r;mi=index;break}}if(ri<0)return;const game=b.rounds[ri][mi];if(!game.home||!game.away)return;const downstream=b.rounds.slice(ri+1).flat().some(g=>g.winner||g.sets?.length);if(game.winner&&downstream){alert('Later-round results exist. To protect the bracket, do not correct this result until downstream results are cleared through a controlled reset.');return}const raw=prompt(`Enter best-of-3 set scores for ${teamName(game.home)} vs ${teamName(game.away)}.\nExample: 21-18,19-21,15-12`,game.sets.map(x=>x.join('-')).join(','));if(raw===null)return;const parts=raw.split(',').map(x=>x.trim()).filter(Boolean);if(parts.length<2||parts.length>3){alert('Use two or three sets in the format 21-18,21-19.');return}const sets=[];for(const p of parts){const match=p.match(/^(\d{1,3})\s*-\s*(\d{1,3})$/);if(!match){alert('Invalid set format.');return}const a=+match[1],c=+match[2];if(a===c){alert('Tied sets are not valid.');return}sets.push([a,c])}const home=sets.filter(x=>x[0]>x[1]).length,away=sets.length-home;if(Math.max(home,away)!==2||sets.length!==home+away||sets.slice(0,-1).some((_,i)=>{const sub=sets.slice(0,i+1);return sub.filter(x=>x[0]>x[1]).length>=2||sub.filter(x=>x[1]>x[0]).length>=2})){alert('A best-of-three match must end when a team wins two sets.');return}if(!confirm('Save result and advance the winning team?'))return;game.sets=sets;game.winner=home>away?game.home:game.away;if(ri+1<b.rounds.length){const next=b.rounds[ri+1][Math.floor(mi/2)];next[mi%2?'away':'home']=game.winner}else b.champion=game.winner;action(()=>compSaveBracket(b,record.version),'Championship result saved and bracket advanced.')}

function validatedPublicSets(m){

 if(!m.sets.every(p=>Array.isArray(p)&&p.length===2&&p.every(v=>Number.isInteger(Number(v))&&Number(v)>=0&&Number(v)<=999)&&Number(p[0])!==Number(p[1])))return null;
 const sets=m.sets.map(p=>p.map(Number)),a=sets.filter(p=>p[0]>p[1]).length,b=sets.length-a;
 if(Number(m.home_score)!==a||Number(m.away_score)!==b)return null;

}
function publicStandings(){

function phaseBTasks(){
 if(!state.seasonId)return [];
 const pending=outreachReqs().filter(r=>r.status==='pending');
 const registered=regRows();
 const assigned=new Set(seasonRows('members').map(x=>x.player_id));
 const unassigned=registered.filter(r=>!assigned.has(r.player_id));
 const upcoming=attUpcoming();
 const missing=upcoming.flatMap(s=>attAbsences(s.id).map(a=>({a,s})));
 const requested=subCallups().filter(c=>c.status==='requested');
 const today=attToday();
 const incomplete=matchRows('regular').filter(m=>m.status!=='completed'&&m.match_date<today);
 const withoutDates=registered.length&&!attRows('sessions').some(s=>s.session_date>=today);
 const tasks=[];
 if(missing.length)tasks.push({name:`${missing.length} absence report${missing.length===1?'':'s'} to review`,detail:`Across ${new Set(missing.map(x=>x.s.id)).size} upcoming play date(s); decide whether substitutes are needed`,goto:'attendance',weight:1});
 if(requested.length)tasks.push({name:`${requested.length} substitute call-up${requested.length===1?'':'s'} awaiting response`,detail:'Contact and confirm manually; no message has been sent by League HQ',goto:'subpool',weight:1});
 if(pending.length)tasks.push({name:`${pending.length} registration request${pending.length===1?'':'s'} awaiting review`,detail:'Review teammate requests and individual/team registrations',goto:'registration',weight:2});
 if(unassigned.length)tasks.push({name:`${unassigned.length} registered player${unassigned.length===1?'':'s'} without a team`,detail:'Director makes the assignments; no automatic balancing',goto:'teams',weight:2});
 if(incomplete.length)tasks.push({name:`${incomplete.length} past match${incomplete.length===1?'':'es'} without a completed result`,detail:'Review results; do not infer winners from schedules',goto:'games',weight:2});
 if(withoutDates)tasks.push({name:'No upcoming attendance dates',detail:'Add league play dates or import them from the schedule',goto:'attendance',weight:3});
 return tasks.sort((a,b)=>a.weight-b.weight);
}

// Double elimination: director-scored, wave-based advancement. Each loss tracked,
// two losses eliminate a team. Grand final resets if the undefeated team loses.
function flow17DoubleLosses(b){const losses=Object.fromEntries(b.seeded.map(id=>[id,0]));for(const round of b.rounds)for(const m of round){if(m.winner&&m.home&&m.away){const loser=m.winner===m.home?m.away:m.home;losses[loser]++}}return losses}

function flow17DoubleAdvance(b){if(b.champion)return b;const last=b.rounds.at(-1)||[];if(last.some(g=>!g.winner))return b;const lastFinal=last.find(g=>g.kind==='grand_final');if(lastFinal){const losses=flow17DoubleLosses(b);if(losses[lastFinal.home]===1&&losses[lastFinal.away]===1){b.rounds.push([{id:`d${b.rounds.length+1}m1`,home:lastFinal.home,away:lastFinal.away,winner:null,sets:[],kind:'final_reset'}]);return b}b.champion=lastFinal.winner;return b}
 const reset=last.find(g=>g.kind==='final_reset');if(reset){b.champion=reset.winner;return b}
 const losses=flow17DoubleLosses(b),alive=b.seeded.filter(id=>losses[id]<2),zero=alive.filter(id=>losses[id]===0),one=alive.filter(id=>losses[id]===1);
 if(alive.length===1){b.champion=alive[0];return b}
 const index=b.rounds.length+1;
 if(zero.length===1&&one.length===1){b.rounds.push([{id:`d${index}m1`,home:zero[0],away:one[0],winner:null,sets:[],kind:'grand_final'}]);return b}
 let games=[];if(zero.length>1)games.push(...flow17DoublePairs(zero,index,'winners',b));if(one.length>1)games.push(...flow17DoublePairs(one,index,'elimination',b));
 if(!games.length)throw Error('Unable to advance double-elimination matches. Contact the director.');
 // A bye only carries the team to the next wave; it never records a fictitious win.
 games.forEach((g,i)=>g.id=`d${index}m${i+1}`);b.rounds.push(games);return b;
}

function flow17LocalDate(date){const [y,m,d]=String(date).split('-').map(Number);return new Date(y,m-1,d,12,0,0)}
function flow17ISO(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function flow17RoundRobin(ids){const list=ids.slice();if(list.length%2)list.push(null);const n=list.length;let pool=list.slice(),rounds=[];for(let round=0;round<n-1;round++){const pairs=[];for(let i=0;i<n/2;i++){const a=pool[i],b=pool[n-1-i];if(a&&b)pairs.push([a,b])}rounds.push(pairs);pool=[pool[0],pool[n-1],...pool.slice(1,n-1)]}return rounds}

function flow17Build(plan,teams){if(!teams||teams.length<2)throw Error('Create at least two teams first.');if(!/^\d{4}-\d{2}-\d{2}$/.test(plan.start))throw Error('Choose a start date.');const weeks=Number(plan.weeks);if(!Number.isInteger(weeks)||weeks<2||weeks>52)throw Error('Choose 2–52 weeks, including championship week.');const rules=(plan.rules||[]).filter(r=>r.enabled);if(!rules.length)throw Error('Choose at least one play day.');const rounds=flow17RoundRobin(teams.map(x=>x.id));let cursor=0;const sessions=[],matches=[];const first=flow17LocalDate(plan.start);for(let week=1;week<=weeks;week++){
 const starts=new Date(first);starts.setDate(first.getDate()+(week-1)*7);
 const dates=Array.from({length:7},(_,i)=>{const dt=new Date(starts);dt.setDate(starts.getDate()+i);return dt}).filter(dt=>rules.some(r=>r.day===dt.getDay()));
 if(!dates.length)throw Error(`Week ${week} has no selected day: check start date.`);
 for(const date of dates){if(week===weeks&&date!==dates[0])continue;const rule=rules.find(r=>r.day===date.getDay());const last=week===weeks;
 const kind=last?'championship':rule.kind;const spec={date:flow17ISO(date),week,kind,target:last?21:rule.target,best_of:last?3:rule.bestOf,standings:last?false:rule.standings,start:rule.time,courts:rule.courts,minutes:rule.minutes,label:last?'Championship (reserved)':kind==='round_robin'?'Team Night':'Regular League Night'};sessions.push(spec);if(last)continue;

 for(const [home,away] of pairs){let placed=false;for(const wave of waves){if(wave.length<rule.courts&&wave.every(m=>m.home!==home&&m.away!==home&&m.home!==away&&m.away!==away)){wave.push({home,away});placed=true;break}}if(!placed)waves.push([{home,away}])}

 const p=waves[wi][ci];matches.push({...p,date:spec.date,week,time:flow17Time(rule.time,wi*rule.minutes),court:ci+1,best_of:rule.bestOf,target:rule.target,standings:rule.standings});}

 <div class="card" style="margin-top:14px"><h2>Issued access codes</h2><div class="stack">${lhq18.tokens.filter(t=>t.season_id===state.seasonId).sort((a,b)=>b.created_at.localeCompare(a.created_at)).slice(0,35).map(t=>`<div class="row between item"><div><strong>${esc(t.scope_date)} · ${esc(t.court||'All courts')}</strong><span class="mini">${t.revoked_at?'Revoked':new Date(t.expires_at)<new Date()?'Expired':'Active'} · Issued ${new Date(t.created_at).toLocaleString()}</span></div>${!t.revoked_at?`<button class="btn danger" data-lhq18-revoke="${esc(t.id)}">Revoke</button>`:''}</div>`).join('')||'<p class="mini">No QR codes issued.</p>'}</div></div>
 <div class="card" style="margin-top:14px"><h2>Recent official score changes</h2><p class="mini">Director-only audit history. QR submissions and decisions remain in the approval log above.</p><div class="stack">${lhq18.audit.filter(a=>a.season_id===state.seasonId).sort((a,b)=>b.changed_at.localeCompare(a.changed_at)).slice(0,12).map(a=>`<div class="item mini"><strong>${a.source==='bracket'?'Championship bracket revised':'Match result revised'}</strong> · ${new Date(a.changed_at).toLocaleString()}<div class="muted">Record: ${esc(a.record_id)}</div></div>`).join('')||'<p class="mini">No official score changes logged since M15 installation.</p>'}</div></div>`;
}
async function lhq18Reload(){const [tokens,subs,audit]=await Promise.all([query('lhq_score_tokens'),query('lhq_score_submissions'),query('lhq_score_audit')]);lhq18.tokens=tokens;lhq18.submissions=subs;lhq18.audit=audit;}
function lhq18Print(html){const el=document.createElement('div');el.id='lhq18Printable';el.innerHTML=html;document.body.appendChild(el);const finish=()=>{document.getElementById('lhq18Printable')?.remove();window.removeEventListener('afterprint',finish)};window.addEventListener('afterprint',finish);window.print();}
function lhq18ScorePrint(){const matches=seasonRows('matches').filter(m=>m.match_date===lhq18.day).sort((a,b)=>String(a.start_time).localeCompare(String(b.start_time))||String(a.court).localeCompare(String(b.court)));
 const records=matches.map(m=>{const spec=flow175Spec(m);return `<article class="lhq18-print-match"><h3>${esc(String(m.start_time||'').slice(0,5))} · ${esc(m.court)} · ${esc(teamName(m.home_team_id))} vs ${esc(teamName(m.away_team_id))}</h3><p>${spec.best===1?'Single game':'Best of '+spec.best}${spec.allSets?' · Play all sets':''}</p><table><thead><tr><th>Set</th><th>Target</th><th>${esc(teamName(m.home_team_id))}</th><th>${esc(teamName(m.away_team_id))}</th></tr></thead><tbody>${spec.targets.map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td>________</td><td>________</td></tr>`).join('')}</tbody></table></article>`}).join('');
 const b=compBracket()?.bracket;const championship=typeof flow17Sessions==='function'&&flow17Sessions().some(s=>s.session_date===lhq18.day&&s.session_kind==='championship');const champSheets=championship&&b?b.rounds.flat().filter(g=>g.home&&g.away).map(g=>{const r=compBracket(),f=flow178Find(b,g.id),spec=flow178Rules(r,f.ri,g);return `<article class="lhq18-print-match"><h3>Championship · ${esc(g.id)} · ${esc(teamName(g.home))} vs ${esc(teamName(g.away))}</h3><table><thead><tr><th>Set</th><th>Target</th><th>${esc(teamName(g.home))}</th><th>${esc(teamName(g.away))}</th></tr></thead><tbody>${spec.targets.map((t,i)=>`<tr><td>${i+1}</td><td>${t}</td><td>________</td><td>________</td></tr>`).join('')}</tbody></table></article>`}).join(''):'';
 lhq18Print(`<h1>${esc(selectedLeague()?.name)} · ${esc(selectedSeason()?.name)}</h1><h2>Scorekeeping packet · ${esc(lhq18.day)}</h2><p>Record every set, then submit through the assigned QR or return sheets to the director.</p>${records}${champSheets||''}${lhq18.issued?.season===state.seasonId&&lhq18.issued?.date===lhq18.day?`<section style="break-before:page;text-align:center"><h2>Restricted scorekeeper QR</h2>${lhq18QrSVG(lhq18.issued.url)}<p>Scores require director approval.</p></section>`:''}${!records&&!champSheets?'<p>No currently scheduled matches.</p>':''}`);
}
function lhq18Wire(){const d=$('lhq18Date');if(d)d.onchange=()=>{lhq18.day=d.value;lhq18.issued=null;render()};const c=$('lhq18Court');if(c)c.onchange=()=>lhq18.court=c.value;
 const issue=$('lhq18Issue');if(issue)issue.onclick=async()=>{if(!lhq18.day)return;try{issue.disabled=true;const bytes=new Uint8Array(32);crypto.getRandomValues(bytes);const secret=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');const court=$('lhq18Court')?.value||'';const {data,error}=await db.rpc('lhq_score_token_issue',{p_season_id:state.seasonId,p_date:lhq18.day,p_court:court,p_secret:secret});if(error)throw error;lhq18.issued={id:data,url:lhq18Link(secret),date:lhq18.day,court,season:state.seasonId};await lhq18Reload();render();document.querySelector('.lhq18-qr-sheet')?.scrollIntoView({behavior:'smooth',block:'center'});}catch(e){setAlert(e.message,true)}finally{issue.disabled=false}};
 const print=$('lhq18Print');if(print)print.onclick=lhq18ScorePrint;
 const qrPrint=$('lhq18PrintQr');if(qrPrint)qrPrint.onclick=()=>{if(!lhq18.issued)return;lhq18Print(`<h1>League HQ · Scorekeeper Access</h1><h2>${esc(selectedLeague()?.name)} · ${esc(selectedSeason()?.name)}</h2><h3>${esc(lhq18.issued.date)} · ${esc(lhq18.issued.court||'All courts')}</h3><div style="max-width:290px;margin:18px auto">${lhq18QrSVG(lhq18.issued.url)}</div><p style="overflow-wrap:anywhere">${esc(lhq18.issued.url)}</p><p>Submit scores for director approval. This link does not grant Director Hub access.</p>`)};
 const copy=$('lhq18CopyLink');if(copy)copy.onclick=()=>{if(lhq18.issued)navigator.clipboard?.writeText(lhq18.issued.url).then(()=>setAlert('QR link copied.')).catch(()=>prompt('Copy URL',lhq18.issued.url))};
 document.querySelectorAll('[data-lhq18-revoke]').forEach(el=>el.onclick=async()=>{if(!confirm('Revoke this QR code? Existing pending submissions remain for director review.'))return;try{const {error}=await db.rpc('lhq_score_token_revoke',{p_token_id:el.dataset.lhq18Revoke});if(error)throw error;if(lhq18.issued?.id===el.dataset.lhq18Revoke)lhq18.issued=null;await lhq18Reload();render()}catch(e){setAlert(e.message,true)}});
 document.querySelectorAll('[data-lhq18-reject]').forEach(el=>el.onclick=async()=>{const note=prompt('Reason for rejection (optional):','');if(note===null)return;try{const {error}=await db.rpc('lhq_score_review',{p_submission_id:el.dataset.lhq18Reject,p_decision:'rejected',p_note:note});if(error)throw error;await lhq18Reload();render();setAlert('Submission rejected. Official scores unchanged.')}catch(e){setAlert(e.message,true)}});
 document.querySelectorAll('[data-lhq18-approve]').forEach(el=>el.onclick=async()=>{const s=lhq18.submissions.find(x=>x.id===el.dataset.lhq18Approve);if(!s)return;if(!confirm(`Approve ${s.sets.map(x=>x.join('–')).join(', ')} for ${teamName(s.home_team_id)} vs ${teamName(s.away_team_id)}?`))return;el.disabled=true;try{
 if(s.match_id){const {error}=await db.rpc('lhq_score_review',{p_submission_id:s.id,p_decision:'approved',p_note:''});if(error)throw error;}
 else{const record=compBracket();if(!record)throw Error('Championship bracket unavailable.');const find=flow178Find(record.bracket,s.bracket_game_id);if(!find)throw Error('Championship match changed. Reject and resubmit.');const outcome=flow175Evaluate(s.sets.map(a=>a.map(String)),{...flow178NormalizeRules(s.rules),needed:Math.ceil(s.rules.best/2)});const changes=flow178ChangeResult(record,s.bracket_game_id,outcome,'save');const {error}=await db.rpc('lhq_score_review_bracket',{p_submission_id:s.id,p_expected_version:record.version,p_next_bracket:changes.bracket});if(error)throw error;}
 await lhq18Reload();await refresh();setAlert('Approved. Official results updated.');}catch(e){setAlert('Approval did not complete: '+e.message,true)}finally{el.disabled=false}});
}
// Dedicated, anonymous-capable scoring surface. Server RPCs enforce authorization.
async function lhq18ScorekeeperLoad(){
 lhq18.secret=new URLSearchParams(location.hash.replace(/^#/,'')).get('key')||'';
 $('logout').classList.add('hide');$('who').textContent='Restricted scorekeeper access';document.querySelector('.brand small').textContent='SCOREKEEPER ONLY';
 if(!/^[a-f0-9]{64}$/.test(lhq18.secret)){$('root').innerHTML='<div class="card"><h1>Invalid scorekeeper link</h1><p>Scan the current QR code in your court folder.</p></div>';return;}
 $('root').innerHTML='<div class="card">Loading assigned matches…</div>';
 try{const {data,error}=await db.rpc('lhq_scorekeeper_view',{p_secret:lhq18.secret});if(error)throw error;if(data?.error)throw Error(data.error);lhq18.scorekeeper=data;lhq18DrawScorekeeper();}catch(e){$('root').innerHTML=`<div class="card"><h1>Scorekeeper access unavailable</h1><p>${esc(e.message)}</p></div>`;}
}
function lhq18DrawScorekeeper(){const d=lhq18.scorekeeper,teams=Object.fromEntries((d.teams||[]).map(t=>[t.id,t.name]));const matches=[...(d.matches||[]).map(m=>({...m,category:'regular'})),...(d.bracket_games||[]).map(m=>({...m,category:'championship'}))];
 $('root').innerHTML=`<div class="workspace-head"><div class="eyebrow">LEAGUE HQ · SCOREKEEPER ONLY</div><h1>${esc(d.league)}</h1><p>${esc(d.season)} · ${esc(d.date)} · ${esc(d.court||'All courts')}</p></div><div class="note">Scores submitted here are <strong>pending</strong> until approved by a Director. This QR code does not grant access to player records or league administration.</div><div class="card" style="margin-top:14px"><div class="row between"><h2>Matches for this access code</h2><button class="btn ghost" id="lhq18ScorekeeperReload">Refresh</button></div><div class="stack">${matches.map(m=>`<div class="item"><strong>${esc(teams[m.home]||'Team')} vs ${esc(teams[m.away]||'Team')}</strong><p class="mini">${m.category==='regular'?esc((m.time||'').slice(0,5))+' · '+esc(m.court):'Championship · '+esc(m.kind||m.id)}</p><button class="btn primary" data-lhq18-score="${esc(m.category+':'+m.id)}">Enter scores</button></div>`).join('')||'<div class="empty">No eligible matches right now. Results already submitted or scored may no longer appear. Contact your director if an assignment is missing.</div>'}</div></div><div id="lhq18Msg" role="status" style="margin-top:12px"></div>`;
 $('lhq18ScorekeeperReload').onclick=lhq18ScorekeeperLoad;
 document.querySelectorAll('[data-lhq18-score]').forEach(el=>el.onclick=()=>{const [kind,id]=el.dataset.lhq18Score.split(':');const m=matches.find(v=>v.id===id&&v.category===kind);if(m)lhq18Entry(m,teams)});
}
function lhq18Entry(m,teams){let spec;if(m.category==='regular'){spec={best:Number(m.best)||3,targets:Array.isArray(m.targets)?m.targets.map(Number):[],allSets:m.allSets===true};if(spec.targets.length!==spec.best)return alert('Match scoring rules unavailable. Ask director to review schedule.');}else{if(!m.rules)return alert('Director must set this championship match’s scoring rules first.');spec={...flow178NormalizeRules(m.rules),allSets:false};}
 const home=teams[m.home]||'Home',away=teams[m.away]||'Away';const cover=document.createElement('div');cover.className='modalcover';cover.id='lhq18EntryCover';cover.innerHTML=`<div class="modal flow175-modal"><div class="row between"><h2>Submit set scores</h2><button id="lhq18EntryClose" class="btn ghost">Close</button></div><p class="mini">${esc(home)} vs ${esc(away)} · ${spec.allSets?'All sets required':'Best of '+spec.best}</p><form id="lhq18EntryForm"><div class="flow175-score-head"><span>Set</span><strong>${esc(home)}</strong><strong>${esc(away)}</strong></div>${spec.targets.map((target,i)=>`<div class="flow175-score-row"><label class="flow175-set-label">Set ${i+1}<small>to ${target}</small></label><input name="h${i}" type="number" min="0" max="999" inputmode="numeric" aria-label="Set ${i+1} ${esc(home)}"><input name="a${i}" type="number" min="0" max="999" inputmode="numeric" aria-label="Set ${i+1} ${esc(away)}"></div>`).join('')}<div id="lhq18EntryError" class="flow175-error" hidden></div><div class="actions"><button type="submit" class="btn primary">Submit for Director Approval</button></div></form></div>`;document.body.appendChild(cover);
 cover.querySelector('#lhq18EntryClose').onclick=()=>cover.remove();cover.querySelector('#lhq18EntryForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),raw=spec.targets.map((_,i)=>[String(fd.get('h'+i)||''),String(fd.get('a'+i)||'')]);let result;try{result=flow175Evaluate(raw,{...spec,needed:Math.ceil(spec.best/2)});}catch(err){const msg=cover.querySelector('#lhq18EntryError');msg.textContent=err.message;msg.hidden=false;return;}
 if(!confirm(`Submit ${result.scores.map(x=>x.join('–')).join(', ')} for approval? Standings will not change until a director approves.`))return;const submit=e.target.querySelector('[type=submit]');submit.disabled=true;
 try{const {error}=await db.rpc('lhq_scorekeeper_submit',{p_secret:lhq18.secret,p_match_id:m.category==='regular'?m.id:null,p_bracket_game_id:m.category==='championship'?m.id:null,p_sets:result.scores,p_rules:{best:spec.best,targets:spec.targets,allSets:!!spec.allSets}});if(error)throw error;cover.remove();const msg=$('lhq18Msg');if(msg)msg.innerHTML='<div class="note success">Score submitted. Awaiting director approval.</div>';await lhq18ScorekeeperLoad();const fresh=$('lhq18Msg');if(fresh)fresh.innerHTML='<div class="note success">Score submitted for approval. You may continue with another match.</div>';}catch(err){const error=cover.querySelector('#lhq18EntryError');error.textContent=err.message;error.hidden=false;submit.disabled=false;}};
}

// Add a single tool to the existing Season Operations navigation, not a new hub.
const lhq18PrevNav=flow17Nav;
flow17Nav=function(group){const html=lhq18PrevNav(group);return group==='operations'?html.replace('</nav>','<button class="btn ghost" data-goto="scorecenter" type="button">Scorekeeping & Print</button></nav>'):html;};
flow17Routes.scorecenter='operations';
const lhq18PrevPage=pageContent;
pageContent=function(){return state.tab==='scorecenter'?flow17Nav('operations')+lhq18Page():lhq18PrevPage();};
const lhq18PrevOverview=overviewPage;
overviewPage=function(){const count=lhq18Pending().length;return (count?`<div class="card" style="margin-bottom:14px"><h2>${count} score submission(s) awaiting approval</h2><button class="btn primary" data-goto="scorecenter">Review submitted scores</button></div>`:'')+lhq18PrevOverview();};
const lhq18PrevRefresh=refresh;
refresh=async function(){await lhq18PrevRefresh();if(!state.user||state.error)return;try{await lhq18Reload();render();}catch(e){state.error='Scorekeeper migration M15 required: '+e.message;render();}};
const lhq18PrevReset=reset;
reset=function(){lhq18PrevReset();lhq18.tokens=[];lhq18.submissions=[];lhq18.audit=[];lhq18.issued=null;};
const lhq18PrevWire=wireBase;
wireBase=function(){lhq18PrevWire();if(state.tab==='scorecenter')lhq18Wire();};
// Championship scores keep their scroll position through data refreshes.
const lhq18PrevAction=action;
action=async function(fn,success){if(!['championship','scorecenter'].includes(state.tab))return lhq18PrevAction(fn,success);const y=window.scrollY;await lhq18PrevAction(fn,success);requestAnimationFrame(()=>window.scrollTo({top:y,behavior:'instant'}));};

init();
</script></body></html>
